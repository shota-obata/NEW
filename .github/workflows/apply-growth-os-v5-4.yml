name: Apply Growth OS v5.4

on:
  push:
    paths:
      - .github/workflows/apply-growth-os-v5-4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        shell: bash
        run: |
          cat > /tmp/index.html.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/index.html.gz.b64 | gzip -d > index.html
      - name: Commit Growth OS v5.4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build interactive Journey operations v5.4 [skip ci]"
          git push
