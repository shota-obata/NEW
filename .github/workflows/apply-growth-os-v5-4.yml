name: Apply Growth OS v5.4

on:
  push:
    paths:
      - .github/workflows/apply-growth-os-v5-4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='checkpoint-support-runtime-v5-4'
          if marker in s:
              raise SystemExit(0)
          s=s.replace('Growth OS v5.3.1','Growth OS v5.4').replace('Growth OS v5.3','Growth OS v5.4')
          css=r'''
          /* checkpoint-support-runtime-v5-4 */
          .opsbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.opsnote{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}.evidence-list{display:grid;gap:9px;margin-top:12px}.evidence-item{border:1px solid var(--line);border-radius:13px;padding:11px;background:#fafbfc}.evidence-item b{display:block;font-size:12px}.evidence-item span{font-size:11px;color:var(--muted)}.supportflow{display:grid;grid-template-columns:1fr 1fr;gap:14px}.supportstep{border:1px solid var(--line);border-radius:16px;padding:15px}.supportstep h3{margin:0 0 9px;font-size:15px}.supportstep textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:12px}.support-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.support-summary>div{border:1px solid var(--line);border-radius:14px;padding:13px}.support-history{border-left:2px solid var(--line);padding-left:12px;margin:10px 0;font-size:12px;color:var(--muted)}.cpbody{height:auto!important;min-height:0!important;overflow:visible!important}.cp{min-width:0}.road{align-items:start}.timeline{max-width:100%}@media(max-width:1080px){.road{min-width:0!important;display:block!important;padding:0!important}.road:before{display:none!important}.cp{display:grid!important;grid-template-columns:54px 1fr!important;gap:12px!important;text-align:left!important;margin:0 0 14px!important}.cpdot{margin:4px 0!important}.cpbody{margin:0!important}.supportflow,.support-summary{grid-template-columns:1fr}}
          '''
          modal=r'''
          <div id="checkpointModal" class="modal hidden"><div class="modalbox"><button class="close" data-action="close-checkpoint">×</button><div class="eyebrow">CHECKPOINT OPERATION</div><h2 id="cpHeading">Checkpointを運用</h2><div class="form2"><div class="field"><label>タイトル</label><input id="cpTitle"></div><div class="field"><label>期限</label><input id="cpDate" type="date"></div><div class="field"><label>状態</label><select id="cpStatus" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:12px"><option value="done">完了</option><option value="current">進行中</option><option value="next">次</option><option value="blocked">停止</option></select></div><div class="field"><label>必要時間 / 実績時間</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="cpHours" type="number" min="0"><input id="cpActual" type="number" min="0"></div></div><div class="field"><label>到達条件</label><textarea id="cpCriteria"></textarea></div><div class="field"><label>Issue A</label><textarea id="cpIssue"></textarea></div><div class="field"><label>必要Evidence</label><textarea id="cpEvidenceTarget"></textarea></div><div class="field"><label>Evidenceを追加</label><input id="cpEvidenceTitle" placeholder="例：骨格違いモデル3名で検証"><textarea id="cpEvidenceNote" placeholder="結果・判断・Support確認"></textarea></div></div><div id="cpEvidenceList" class="evidence-list"></div><div class="opsbar" style="justify-content:flex-end"><button class="btn secondary" data-action="add-evidence">Evidence追加</button><button class="btn secondary" data-action="set-current-checkpoint">Currentに設定</button><button class="btn primary" data-action="save-checkpoint">保存</button><button class="btn primary" data-action="complete-checkpoint">完了判定</button></div></div></div>
          '''
          js=r'''
          ;(()=>{if(window.__growthOpsV54)return;window.__growthOpsV54=true;state.journey=state.journey||{checkpoints:[],history:[]};state.journey.history=state.journey.history||[];state.supportSessions=state.supportSessions||[];state.journey.checkpoints.forEach(c=>{c.evidenceItems=Array.isArray(c.evidenceItems)?c.evidenceItems:[];c.history=Array.isArray(c.history)?c.history:[];c.supportHistory=Array.isArray(c.supportHistory)?c.supportHistory:[]});let activeCpId=null;const actor=()=>state.role==='support'?'Support':state.role==='management'?'Management':'Staff';const stamp=(action,detail='')=>({at:now(),by:actor(),action,detail});function cpById(id){return state.journey.checkpoints.find(c=>c.id===id)}function currentCp(){return state.journey.checkpoints.find(c=>c.status==='current')||state.journey.checkpoints.find(c=>c.status!=='done')||state.journey.checkpoints[0]}function renderCpEvidence(c){cpEvidenceList.innerHTML=(c.evidenceItems||[]).map((e,i)=>`<div class="evidence-item"><b>${esc(e.title)}</b><span>${esc(e.note||'')}</span><div class="opsnote">${esc(e.by)}・${esc(e.at)}</div><button class="btn secondary small" data-action="remove-evidence" data-index="${i}">削除</button></div>`).join('')||'<p class="lead">Evidenceはまだありません。</p>'}function openCp(id){const c=cpById(id);if(!c)return;activeCpId=id;cpHeading.textContent=`${c.code||''} ${c.title||''}`;cpTitle.value=c.title||'';cpDate.value=c.date||'';cpStatus.value=c.status||'next';cpHours.value=c.hours||0;cpActual.value=c.actual||0;cpCriteria.value=c.criteria||'';cpIssue.value=c.issue||'';cpEvidenceTarget.value=c.evidence||'';cpEvidenceTitle.value='';cpEvidenceNote.value='';renderCpEvidence(c);checkpointModal.classList.remove('hidden')}function recalcJourney(){const cps=state.journey.checkpoints;const total=cps.reduce((n,c)=>n+(Number(c.hours)||0),0);const actual=cps.reduce((n,c)=>n+(Number(c.actual)||0),0);state.journey.requiredHours=total;state.journey.actualHours=actual;state.progress=total?Math.min(100,Math.round(actual/total*100)):0}function saveCp(action='Checkpointを更新'){const c=cpById(activeCpId);if(!c)return;c.title=cpTitle.value.trim();c.date=cpDate.value;c.status=cpStatus.value;c.hours=Number(cpHours.value)||0;c.actual=Number(cpActual.value)||0;c.criteria=cpCriteria.value.trim();c.issue=cpIssue.value.trim();c.evidence=cpEvidenceTarget.value.trim();c.history.push(stamp(action));state.journey.history.push(stamp(action,`${c.code||''} ${c.title}`));if(c.status==='current'&&c.issue)state.issue.title=c.issue;recalcJourney();save();checkpointModal.classList.add('hidden');render()}function augmentJourney(){document.querySelectorAll('#journey .cp').forEach((node,i)=>{const c=state.journey.checkpoints[i];if(!c||node.querySelector('.checkpoint-ops'))return;const body=node.querySelector('.cpbody')||node;const box=document.createElement('div');box.className='checkpoint-ops';box.innerHTML=`<div class="opsnote">Evidence ${(c.evidenceItems||[]).length}件・Support修正 ${(c.supportHistory||[]).length}件</div><div class="opsbar"><button class="btn secondary small" data-action="open-checkpoint" data-id="${c.id}">Checkpointを開く</button>${c.status==='current'?'<button class="btn primary small" data-page="support">Supportへ</button>':''}</div>`;body.appendChild(box)})}function renderSupportOps(){const root=document.getElementById('support');if(!root)return;const c=currentCp();const sessions=state.supportSessions.filter(x=>!c||x.checkpointId===c.id);root.innerHTML=`<div class="head"><div><div class="eyebrow">SUPPORT OPERATION</div><h1>答えを渡さず、判断を修正する。</h1><p class="lead">Current CheckpointとIssue Aを基準に、比較・診断・修正・再検証・Library化まで記録します。</p></div></div><section class="card"><div class="support-summary"><div><div class="title">CURRENT CHECKPOINT</div><b>${esc(c?.code||'-')} ${esc(c?.title||'未設定')}</b></div><div><div class="title">ISSUE A</div><b>${esc(state.issue?.title||c?.issue||'未設定')}</b></div><div><div class="title">EVIDENCE</div><b>${c?.evidenceItems?.length||0}件</b></div></div></section><section class="card" style="margin-top:16px"><div class="supportflow"><div class="supportstep"><h3>1｜比較質問</h3><textarea id="spCompare" placeholder="何と何を比べると違いが見えるか？"></textarea></div><div class="supportstep"><h3>2｜原因診断</h3><textarea id="spDiagnosis" placeholder="観察・完成像・基準点・操作のどこでズレたか？"></textarea></div><div class="supportstep"><h3>3｜Support修正</h3><textarea id="spCorrection" placeholder="判断をどう修正するか？"></textarea></div><div class="supportstep"><h3>4｜次の検証</h3><textarea id="spNext" placeholder="次に何を、どの条件で確かめるか？"></textarea></div></div><div class="opsbar" style="justify-content:flex-end"><button class="btn secondary" data-action="save-support">Support記録を保存</button><button class="btn primary" data-action="apply-support">Issue Aへ反映</button><button class="btn primary" data-action="support-to-library">Library化</button></div></section><section class="card" style="margin-top:16px"><div class="title">SUPPORT HISTORY</div>${sessions.slice().reverse().map(x=>`<div class="support-history"><b>${esc(x.by)}・${esc(x.at)}</b><br>比較：${esc(x.compare)}<br>診断：${esc(x.diagnosis)}<br>修正：${esc(x.correction)}<br>次：${esc(x.next)}</div>`).join('')||'<p class="lead">まだSupport記録はありません。</p>'}</section>`}function supportDraft(){const c=currentCp();return{id:'sp-'+Date.now(),checkpointId:c?.id||'',issue:state.issue?.title||c?.issue||'',compare:spCompare.value.trim(),diagnosis:spDiagnosis.value.trim(),correction:spCorrection.value.trim(),next:spNext.value.trim(),by:actor(),at:now()}}function saveSupport(apply=false,toLibrary=false){const c=currentCp();const x=supportDraft();if(!x.compare&&!x.diagnosis&&!x.correction&&!x.next)return alert('Support内容を入力してください。');state.supportSessions.push(x);if(c){c.supportHistory.push(x);c.history.push(stamp('Support介入',x.correction));if(apply){c.issue=x.next||c.issue;state.issue.title=x.next||state.issue.title}}if(toLibrary){state.library.unshift({id:'support-'+Date.now(),title:`${c?.title||'Checkpoint'}｜Support修正`,tag:'Support',case:x.issue,decision:x.diagnosis,correction:x.correction,rule:x.compare,next:x.next,image:'',updatedBy:actor(),updatedAt:now(),history:[{at:x.at,by:x.by,action:'SupportからLibrary化'}]})}save();render()}const originalRender=render;render=function(){originalRender();augmentJourney();if(state.page==='support')renderSupportOps()};document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='open-checkpoint')openCp(b.dataset.id);if(a==='close-checkpoint')checkpointModal.classList.add('hidden');if(a==='add-evidence'){const c=cpById(activeCpId),title=cpEvidenceTitle.value.trim();if(!c||!title)return alert('Evidence名を入力してください。');c.evidenceItems.push({title,note:cpEvidenceNote.value.trim(),by:actor(),at:now()});c.history.push(stamp('Evidence追加',title));save();renderCpEvidence(c);cpEvidenceTitle.value='';cpEvidenceNote.value=''}if(a==='remove-evidence'){const c=cpById(activeCpId);if(c){c.evidenceItems.splice(Number(b.dataset.index),1);c.history.push(stamp('Evidence削除'));save();renderCpEvidence(c)}}if(a==='save-checkpoint')saveCp();if(a==='set-current-checkpoint'){state.journey.checkpoints.forEach(c=>{if(c.status==='current')c.status='next'});cpStatus.value='current';saveCp('Current Checkpointを変更')}if(a==='complete-checkpoint'){const c=cpById(activeCpId);if(!c)return;if(!(c.evidenceItems||[]).length&&!confirm('Evidenceが0件です。それでも完了にしますか？'))return;cpStatus.value='done';saveCp('Checkpoint完了');const next=state.journey.checkpoints.find(x=>x.status==='next');if(next){next.status='current';if(next.issue)state.issue.title=next.issue;save();render()}}if(a==='save-support')saveSupport(false,false);if(a==='apply-support')saveSupport(true,false);if(a==='support-to-library')saveSupport(true,true)});render()})();
          '''
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('<script>',modal+'<script>',1)
          i=s.rfind('</script>')
          s=s[:i]+js+s[i:]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Implement operational checkpoints and support linkage" || exit 0
          git push
