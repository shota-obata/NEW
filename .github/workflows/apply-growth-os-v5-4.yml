name: Apply Growth OS v5.5 UI Foundation

on:
  push:
    paths:
      - .github/workflows/apply-growth-os-v5-4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign interface and add model planner
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='growth-os-ui-v5-5'
          if marker in s:
              raise SystemExit(0)
          s=s.replace('Growth OS v5.4','Growth OS v5.5')
          css=r'''
          /* growth-os-ui-v5-5 */
          :root{--bg:#f4f2ed;--card:#fffdfa;--text:#171715;--muted:#77736b;--line:#e5e1d9;--blue:#ef6d4f;--blue2:#fff0ea;--green:#16b98e;--orange:#ef9e3d;--orange2:#fff4df;--purple:#7a67d8;--shadow:0 1px 2px rgba(25,22,18,.04),0 18px 45px rgba(42,35,25,.07);--side:248px}
          body{background:var(--bg);letter-spacing:-.01em}.top{height:64px;background:rgba(244,242,237,.86);border-bottom:0;padding:0 22px}.brand{font-family:Georgia,'Noto Serif JP',serif;font-size:19px}.mark{background:#171715;border-radius:50%;width:31px;height:31px}.role{background:transparent;border-color:transparent;color:var(--muted)}.role.active{background:#fff;color:var(--text);box-shadow:0 1px 8px rgba(20,18,15,.08)}.shell{grid-template-columns:var(--side) minmax(0,1fr);gap:0}.side{top:64px;height:calc(100vh - 64px);background:linear-gradient(180deg,#f2b866 0%,#ef846d 58%,#e7657c 100%);border:0;padding:20px 14px}.side .label{color:rgba(35,21,19,.55);padding-top:20px}.side .nav{color:#301e1c;padding:11px 13px;border-radius:13px;margin:2px 0}.side .nav.active{background:rgba(255,255,255,.82);color:#161311;box-shadow:0 10px 24px rgba(89,35,27,.12)}.page{padding:38px 42px 80px;max-width:1500px}.head{margin-bottom:26px}.head h1{font-family:Georgia,'Noto Serif JP',serif;font-weight:500;font-size:42px;line-height:1.14;letter-spacing:-.045em}.eyebrow{color:#d95e42}.card{background:var(--card);border-color:rgba(220,214,203,.85);border-radius:25px;box-shadow:var(--shadow);padding:22px}.btn{border-radius:12px}.primary{background:#1d1d1b}.secondary{background:#fffdfa}.progress{background:#e8e5df}.progress span{background:var(--green)}
          .os-section-title{display:flex;justify-content:space-between;align-items:end;margin:30px 0 13px}.os-section-title h2{margin:0;font-size:24px}.os-section-title p{margin:0;color:var(--muted);font-size:13px}.os-overview{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.45fr);gap:16px}.os-vision{min-height:250px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#fffdfa 35%,#f6f0e6)}.os-vision h2{font-family:Georgia,'Noto Serif JP',serif;font-size:clamp(28px,3.2vw,48px);line-height:1.18;font-weight:500;margin:18px 0;max-width:920px}.os-kicker{display:flex;gap:10px;flex-wrap:wrap}.os-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#f0ede7;font-size:12px;font-weight:800}.os-score{background:#191918;color:#fff;display:flex;flex-direction:column;justify-content:space-between}.os-score .score{font-size:64px;font-weight:900;line-height:1}.os-score .score small{font-size:17px;color:#aaa69f}.os-score .progress{background:#3c3c39}.os-score .progress span{background:#35d0a8}.current-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:16px}.current-card{border:1px solid #d8d2c8;background:#fffdfa}.current-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.current-code{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#171715;color:#fff;font-weight:900;flex:0 0 auto}.current-main{flex:1}.current-main h2{margin:1px 0 8px;font-size:27px}.current-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}.issue-panel{background:#f2eee8;border:0}.issue-panel h3{font-size:17px;line-height:1.55;margin:8px 0 14px}.action-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.route-card{padding:18px 20px}.route{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));position:relative;gap:8px}.route:before{content:'';position:absolute;left:7%;right:7%;top:23px;height:3px;background:#ddd9d2}.route-stop{position:relative;z-index:1;text-align:center;min-width:0}.route-dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 11px;background:#fff;border:3px solid #d9d6d0;font-weight:900}.route-stop.done .route-dot{background:#1d1d1b;border-color:#1d1d1b;color:#fff}.route-stop.current .route-dot{background:#ef6d4f;border-color:#ef6d4f;color:#fff;box-shadow:0 0 0 6px #fff0ea}.route-name{font-weight:850;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.route-date{font-size:11px;color:var(--muted);margin-top:3px}.route-stop button{all:unset;cursor:pointer;display:block;width:100%}.detail-drawer{margin-top:16px}.detail-drawer details{background:#fffdfa;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}.detail-drawer summary{list-style:none;cursor:pointer;padding:17px 18px;font-weight:850;display:flex;justify-content:space-between}.detail-drawer summary::-webkit-details-marker{display:none}.detail-body{padding:0 18px 18px}.detail-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.detail-metric{background:#f3f0ea;border-radius:14px;padding:14px}.detail-metric b{display:block;font-size:24px;margin-top:4px}.history-compact{padding:10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
          .planner-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.planner-toolbar h1{font-family:Georgia,'Noto Serif JP',serif;font-weight:500;margin:0;font-size:40px}.planner-nav{display:flex;gap:8px;align-items:center}.calendar-shell{display:grid;grid-template-columns:220px minmax(0,1fr) 270px;background:#fffdfa;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);min-height:680px}.calendar-left,.calendar-right{padding:20px;border-right:1px solid var(--line)}.calendar-right{border-right:0;border-left:1px solid var(--line)}.mini-month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:11px;text-align:center}.mini-month b{padding:7px 0}.mini-month span{padding:7px 0;border-radius:8px;color:var(--muted)}.mini-month .today{background:#ef6d4f;color:#fff;font-weight:900}.calendar-center{min-width:0;overflow:auto}.week-head{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));position:sticky;top:0;background:#fffdfa;z-index:4;border-bottom:1px solid var(--line)}.day-head{padding:15px 10px;text-align:center;border-right:1px solid var(--line)}.day-head b{display:block;font-size:20px}.day-head.today b{color:#ef6d4f}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));min-height:610px}.day-column{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,#f0ede8 60px)}.model-event{border-radius:11px;padding:10px 11px;font-size:12px;line-height:1.45;background:#dff5ef;border-left:4px solid #16b98e;box-shadow:0 3px 12px rgba(26,35,30,.05);cursor:pointer}.model-event.cut{background:#e1f1fa;border-left-color:#2ca1d6}.model-event.color{background:#fff0dd;border-left-color:#ef9e3d}.model-event b{display:block;font-size:13px}.model-event small{color:#625e58}.planner-list{display:grid;gap:9px}.planner-list .model-event{background:#f4f1eb;border-left-color:#171715}.empty-day{font-size:11px;color:#aaa59d;padding:10px 2px}.right-block{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}.right-block h3{font-size:14px;margin:0 0 10px}.right-block p{font-size:12px;color:var(--muted);line-height:1.6}.model-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
          @media(max-width:1180px){.os-overview,.current-grid{grid-template-columns:1fr}.calendar-shell{grid-template-columns:1fr}.calendar-left,.calendar-right{display:none}.detail-metrics{grid-template-columns:repeat(2,1fr)}}
          @media(max-width:920px){.top{height:auto}.page{padding:24px 15px 90px}.head h1,.planner-toolbar h1{font-size:32px}.side{display:none}.os-overview{display:block}.os-score{margin-top:12px}.route{display:flex;overflow-x:auto;padding:8px 2px 15px}.route:before{display:none}.route-stop{min-width:128px}.calendar-shell{border-radius:18px}.week-head,.week-grid{grid-template-columns:repeat(7,minmax(150px,1fr))}.planner-toolbar{align-items:flex-start;flex-direction:column}.model-form-grid{grid-template-columns:1fr}.bottom{background:rgba(255,253,250,.94);backdrop-filter:blur(14px)}}
          @media(max-width:560px){.detail-metrics{grid-template-columns:1fr}.os-vision{min-height:210px}.os-score .score{font-size:52px}.current-top{flex-wrap:wrap}}
          '''
          planner_section='<section id="planner" class="page"></section>'
          model_modal=r'''
          <div id="modelModal" class="modal hidden"><div class="modalbox"><button class="close" data-ui-action="close-model">×</button><div class="eyebrow">MODEL PLANNER</div><h2 id="modelHeading">モデル予定を追加</h2><div class="model-form-grid"><div class="field"><label>モデル名</label><input id="mName"></div><div class="field"><label>日付</label><input id="mDate" type="date"></div><div class="field"><label>開始時間</label><input id="mTime" type="time"></div><div class="field"><label>予定時間（分）</label><input id="mDuration" type="number" min="15" step="15" value="120"></div><div class="field"><label>メニュー</label><select id="mMenu" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:12px"><option>カット</option><option>カラー</option><option>カット＋カラー</option><option>接客モデル</option><option>撮影</option></select></div><div class="field"><label>Checkpoint</label><select id="mCheckpoint" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:12px"></select></div><div class="field" style="grid-column:1/-1"><label>検証テーマ・メモ</label><textarea id="mNote"></textarea></div></div><div class="action-row" style="justify-content:space-between"><button id="deleteModelBtn" class="btn danger hidden" data-ui-action="delete-model">削除</button><div style="margin-left:auto;display:flex;gap:8px"><button class="btn secondary" data-ui-action="close-model">キャンセル</button><button class="btn primary" data-ui-action="save-model">保存</button></div></div></div></div>
          '''
          js=r'''
          ;(()=>{if(window.__growthUiV55)return;window.__growthUiV55=true;
          state.modelBookings=Array.isArray(state.modelBookings)?state.modelBookings:[];let editingModelId=null;let plannerOffset=0;
          const pad=n=>String(n).padStart(2,'0');const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};const monday=d=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x};
          function currentCheckpointV55(){return state.journey?.checkpoints?.find(c=>c.status==='current')||state.journey?.checkpoints?.find(c=>c.status!=='done')||state.journey?.checkpoints?.[0]}
          function renderJourneyV55(){const root=document.getElementById('journey');if(!root)return;const cps=state.journey?.checkpoints||[];const cur=currentCheckpointV55();const days=Math.max(0,Math.ceil((new Date(state.deadline)-new Date())/86400000));const total=Number(state.journey?.requiredHours)||cps.reduce((n,c)=>n+(Number(c.hours)||0),0);const actual=Number(state.journey?.actualHours)||cps.reduce((n,c)=>n+(Number(c.actual)||0),0);const progress=total?Math.min(100,Math.round(actual/total*100)):Number(state.progress)||0;const planned=Number(state.planned)||0;const gap=progress-planned;const evidence=cur?.evidenceItems?.length||0;const support=cur?.supportHistory?.length||0;const remain=Math.max(0,total-actual);root.innerHTML=`<div class="head"><div><div class="eyebrow">JOURNEY MAP</div><h1>現在地と、次の一歩。</h1><p class="lead">全情報は保持したまま、概要・現在地・ルート・詳細の順で整理しています。</p></div></div><div class="os-overview"><section class="card os-vision"><div><div class="title">VISION</div><h2>${esc(state.vision||'Visionを設定してください')}</h2></div><div class="os-kicker"><span class="os-chip">期限 ${esc(state.deadline||'-')}</span><span class="os-chip">残り ${days}日</span><span class="os-chip">ゼロ残業前提</span></div></section><section class="card os-score"><div><div class="title" style="color:#aaa69f">JOURNEY PROGRESS</div><div class="score">${progress}<small>%</small></div></div><div><div class="progress"><span style="width:${progress}%"></span></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#aaa69f"><span>実績 ${actual}h</span><span>必要 ${total}h</span></div></div></section></div><div class="os-section-title"><div><h2>現在地</h2><p>今取り組むCheckpointとIssue A</p></div></div><div class="current-grid"><section class="card current-card"><div class="current-top"><div class="current-code">${esc(cur?.code||'–')}</div><div class="current-main"><div class="title">CURRENT CHECKPOINT</div><h2>${esc(cur?.title||'未設定')}</h2><div class="current-meta"><span>期限 ${esc(cur?.date||'-')}</span><span>Evidence ${evidence}件</span><span>Support ${support}件</span><span>${Number(cur?.actual)||0} / ${Number(cur?.hours)||0}h</span></div><div class="progress"><span style="width:${cur?.hours?Math.min(100,Math.round((Number(cur.actual)||0)/Number(cur.hours)*100)):0}%"></span></div><div class="action-row"><button class="btn primary" data-action="open-checkpoint" data-id="${cur?.id||''}">Checkpointを開く</button><button class="btn secondary" data-page="practice">Practice</button><button class="btn secondary" data-page="support">Support</button></div></div></div></section><section class="card issue-panel"><div class="title">ISSUE A</div><h3>${esc(state.issue?.title||cur?.issue||'Issue Aを設定してください')}</h3><p class="lead">Supportでは、この問いに対して比較・原因診断・修正・次の検証を記録します。</p></section></div><div class="os-section-title"><div><h2>ルート</h2><p>選択するとCheckpointワークスペースを開きます</p></div></div><section class="card route-card"><div class="route">${cps.map(c=>`<div class="route-stop ${esc(c.status||'next')}"><button data-action="open-checkpoint" data-id="${c.id}"><div class="route-dot">${c.status==='done'?'✓':esc((c.code||'').replace('CP',''))}</div><div class="route-name">${esc(c.title||'')}</div><div class="route-date">${esc(c.date||'')}</div></button></div>`).join('')}</div></section><div class="detail-drawer"><details><summary>Schedule GapとForecast <span>＋</span></summary><div class="detail-body"><div class="detail-metrics"><div class="detail-metric"><span class="title">PLAN</span><b>${planned}%</b></div><div class="detail-metric"><span class="title">ACTUAL</span><b>${progress}%</b></div><div class="detail-metric"><span class="title">GAP</span><b>${gap>0?'+':''}${gap}%</b></div><div class="detail-metric"><span class="title">REMAIN</span><b>${remain}h</b></div></div></div></details><details><summary>Checkpoint詳細と到達条件 <span>＋</span></summary><div class="detail-body">${cps.map(c=>`<div class="history-compact"><b>${esc(c.code)} ${esc(c.title)}</b>　${esc(c.criteria||'到達条件未設定')}<br>必要Evidence：${esc(c.evidence||'未設定')}</div>`).join('')}</div></details><details><summary>Journey履歴 <span>＋</span></summary><div class="detail-body">${(state.journey?.history||[]).slice().reverse().map(h=>`<div class="history-compact"><b>${esc(h.action||'更新')}</b>　${esc(h.detail||'')}<br>${esc(h.by||'')}・${esc(h.at||'')}</div>`).join('')||'<p class="lead">履歴はまだありません。</p>'}</div></details></div>`}
          function ensurePlannerNav(){const side=document.getElementById('side');if(side&&!side.querySelector('[data-page="planner"]')){const b=document.createElement('button');b.className='nav';b.dataset.page='planner';b.textContent='◫  Model Planner';const settings=side.querySelector('[data-page="settings"]');side.insertBefore(b,settings||null)}const bottom=document.querySelector('.bottom');if(bottom&&!bottom.querySelector('[data-page="planner"]')){const b=document.createElement('button');b.dataset.page='planner';b.textContent='Models';bottom.insertBefore(b,bottom.lastElementChild)}}
          function weekDates(){const start=addDays(monday(new Date()),plannerOffset*7);return Array.from({length:7},(_,i)=>addDays(start,i))}
          function modelClass(menu=''){return menu.includes('カラー')?'color':menu.includes('カット')?'cut':''}
          function renderPlanner(){const root=document.getElementById('planner');if(!root)return;const dates=weekDates(),today=ymd(new Date());const month=dates[0].toLocaleDateString('ja-JP',{year:'numeric',month:'long'});const upcoming=state.modelBookings.filter(x=>x.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));root.innerHTML=`<div class="planner-toolbar"><div><div class="eyebrow">MODEL PLANNER</div><h1>${month}</h1><p class="lead">モデルを先に確保し、Checkpoint・Issue A・検証テーマへ接続します。</p></div><div class="planner-nav"><button class="btn secondary" data-ui-action="prev-week">←</button><button class="btn secondary" data-ui-action="today-week">今日</button><button class="btn secondary" data-ui-action="next-week">→</button><button class="btn primary" data-ui-action="new-model">＋ モデルを入れる</button></div></div><div class="calendar-shell"><aside class="calendar-left"><div class="title">QUICK VIEW</div><h3>${month}</h3><div class="mini-month">${['月','火','水','木','金','土','日'].map(x=>`<b>${x}</b>`).join('')}${dates.map(d=>`<span class="${ymd(d)===today?'today':''}">${d.getDate()}</span>`).join('')}</div><div class="right-block" style="margin-top:26px"><h3>設計ルール</h3><p>先にモデル枠を置く。次にCheckpointと検証テーマを紐づける。Practice後にEvidenceへ変換する。</p></div></aside><main class="calendar-center"><div class="week-head">${dates.map(d=>`<div class="day-head ${ymd(d)===today?'today':''}"><span>${d.toLocaleDateString('ja-JP',{weekday:'short'})}</span><b>${d.getDate()}</b></div>`).join('')}</div><div class="week-grid">${dates.map(d=>{const list=state.modelBookings.filter(x=>x.date===ymd(d)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));return `<div class="day-column">${list.map(x=>`<div class="model-event ${modelClass(x.menu)}" data-ui-action="edit-model" data-id="${x.id}"><b>${esc(x.time||'--:--')} ${esc(x.name)}</b><span>${esc(x.menu||'モデル')}</span><br><small>${esc(x.checkpointCode||'')} ${esc(x.note||'')}</small></div>`).join('')||'<div class="empty-day">モデル未設定</div>'}</div>`}).join('')}</div></main><aside class="calendar-right"><div class="right-block"><div class="title">CURRENT CHECKPOINT</div><h3>${esc(currentCheckpointV55()?.code||'-')} ${esc(currentCheckpointV55()?.title||'未設定')}</h3><p>${esc(state.issue?.title||'Issue A未設定')}</p></div><div class="right-block"><h3>今後のモデル</h3><div class="planner-list">${upcoming.slice(0,5).map(x=>`<div class="model-event" data-ui-action="edit-model" data-id="${x.id}"><b>${esc(x.date)} ${esc(x.time)}　${esc(x.name)}</b><small>${esc(x.menu)}・${esc(x.checkpointCode||'')}</small></div>`).join('')||'<p>予定はありません。</p>'}</div></div><button class="btn primary" style="width:100%" data-ui-action="new-model">＋ モデルを入れる</button></aside></div>`}
          function openModel(id=null,date=null){editingModelId=id;const x=id?state.modelBookings.find(v=>v.id===id):null;modelHeading.textContent=x?'モデル予定を編集':'モデル予定を追加';mName.value=x?.name||'';mDate.value=x?.date||date||ymd(new Date());mTime.value=x?.time||'10:00';mDuration.value=x?.duration||120;mMenu.value=x?.menu||'カット';mNote.value=x?.note||'';mCheckpoint.innerHTML=(state.journey?.checkpoints||[]).map(c=>`<option value="${c.id}" ${x?.checkpointId===c.id?'selected':''}>${esc(c.code)} ${esc(c.title)}</option>`).join('');deleteModelBtn.classList.toggle('hidden',!x);modelModal.classList.remove('hidden')}
          function saveModel(){const cp=(state.journey?.checkpoints||[]).find(c=>c.id===mCheckpoint.value);const data={id:editingModelId||'model-'+Date.now(),name:mName.value.trim(),date:mDate.value,time:mTime.value,duration:Number(mDuration.value)||120,menu:mMenu.value,checkpointId:mCheckpoint.value,checkpointCode:cp?.code||'',note:mNote.value.trim(),updatedAt:now()};if(!data.name||!data.date)return alert('モデル名と日付を入力してください。');const i=state.modelBookings.findIndex(x=>x.id===data.id);if(i>=0)state.modelBookings[i]=data;else state.modelBookings.push(data);save();modelModal.classList.add('hidden');render()}
          const originalRenderV55=render;render=function(){originalRenderV55();ensurePlannerNav();if(state.page==='journey')renderJourneyV55();if(state.page==='planner'){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('planner').classList.add('active');renderPlanner()}document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page))};
          document.addEventListener('click',e=>{const page=e.target.closest('[data-page="planner"]');if(page){state.page='planner';save();render();return}const b=e.target.closest('[data-ui-action]');if(!b)return;const a=b.dataset.uiAction;if(a==='new-model')openModel();if(a==='edit-model')openModel(b.dataset.id);if(a==='close-model')modelModal.classList.add('hidden');if(a==='save-model')saveModel();if(a==='delete-model'){if(editingModelId&&confirm('このモデル予定を削除しますか？')){state.modelBookings=state.modelBookings.filter(x=>x.id!==editingModelId);save();modelModal.classList.add('hidden');render()}}if(a==='prev-week'){plannerOffset--;renderPlanner()}if(a==='next-week'){plannerOffset++;renderPlanner()}if(a==='today-week'){plannerOffset=0;renderPlanner()}});render()})();
          '''
          s=s.replace('</style>',css+'</style>',1)
          if 'id="planner"' not in s:
              s=s.replace('<section id="support" class="page">',planner_section+'<section id="support" class="page">',1)
