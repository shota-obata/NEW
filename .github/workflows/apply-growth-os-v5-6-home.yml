name: Apply Growth OS v5.6 Home

on:
  push:
    paths:
      - .github/workflows/apply-growth-os-v5-6-home.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach v5.6 Home UI
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'home-v56.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="home-v56.css?v=56">\n</head>', 1)

          if 'home-v56.js' not in s:
              s = s.replace('</body>', '<script src="home-v56.js?v=56"></script>\n</body>', 1)

          s = s.replace('Growth OS v5.5', 'Growth OS v5.6')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Home redesign
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign Growth OS Home for v5.6"
          git push
