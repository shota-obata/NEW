name: Apply Growth OS v5.7 Practice

on:
  push:
    paths:
      - .github/workflows/apply-growth-os-v5-7-practice.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach v5.7 Practice UI
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'practice-v57.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="practice-v57.css?v=57">\n</head>', 1)
          if 'practice-v57.js' not in s:
              s = s.replace('</body>', '<script src="practice-v57.js?v=57"></script>\n</body>', 1)
          s = s.replace('Growth OS v5.6', 'Growth OS v5.7').replace('Growth OS v5.5', 'Growth OS v5.7')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Practice redesign
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign Practice workflow for v5.7"
          git push
