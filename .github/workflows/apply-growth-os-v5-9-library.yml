name: Apply Growth OS v5.9 Library

on:
  push:
    paths:
      - .github/workflows/apply-growth-os-v5-9-library.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach v5.9 Library UI
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'library-v59.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="library-v59.css?v=59">\n</head>', 1)
          if 'library-v59.js' not in s:
              s = s.replace('</body>', '<script src="library-v59.js?v=59"></script>\n</body>', 1)
          s = s.replace('Growth OS v5.8', 'Growth OS v5.9').replace('Growth OS v5.7', 'Growth OS v5.9').replace('Growth OS v5.6', 'Growth OS v5.9').replace('Growth OS v5.5', 'Growth OS v5.9')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Library redesign
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign Library experience for v5.9"
          git push
