const defaults={schemaVersion:'4.2',profile:{id:'1111',name:'黒坂さん',store:'LOVEST KYOTO'},vision:{text:'骨格と髪質を見ながら、顔まわりを自在に設計できる美容師',reason:'お客様の顔立ちに合わせて、再現性のある提案をできるようになる。',nonGoal:'流行だけを追い、理由を説明できない施術。'},core:{want:'顔まわりの設計を強みにしたい',is:'写真比較から特徴を捉える力がある',must:'安全と再現性を守りながら判断する'},current:{percent:58,status:[{label:'完成像を見る',state:'done'},{label:'基準点へ変換する',state:'current'},{label:'操作へ落とす',state:'next'},{label:'条件変更へ応用',state:'unverified'}]},issue:{id:'issue-face-001',question:'異なる骨格でも、完成像から最短点と最長点を決められるか？',focus:'骨格と完成シルエットの関係',finish:'切る前に、位置と理由を説明できる',visionLink:'顔まわりを自在に設計するための土台'},practice:{status:'ready',evidence:[],startedAt:null,endedAt:null},interview:{index:0,answers:['','',''],questions:['今回、予測と違ったことは何ですか？','その違いにつながった判断は、どの場面でしたか？','その瞬間、何を最も見ていましたか？']},journey:{route:['写真比較','言語化','基準点設計','モデル実践'],current:2,reason:'理解優先。理由を説明できる状態から実践へ進む。'},feed:[{id:'feed-1',date:'2026-07-22',change:'骨格を見るだけでなく、完成像へつなげて考えられた。',evidence:'モデル実践・Support確認'}],inbox:[{id:'inbox-1',date:'2026-07-23',from:'Team Support',title:'次のPractice提案',message:'写真比較ルートは継続し、次回のみ展開図を補助として追加します。',status:'unread',proposal:{next:'決めた最短点を、最初のパネルまで維持する。'}}],archive:[],library:[{id:'lib-1',title:'顔まわり設計｜基準点',type:'展開図',note:'最短点・最長点・接続位置を確認する。'},{id:'lib-2',title:'骨格比較 3パターン',type:'写真比較',note:'異なる条件で完成像を言語化する。'}],lastUpdate:null};
function clone(x){return JSON.parse(JSON.stringify(x))}function merge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a;const out={...a};Object.keys(b||{}).forEach(k=>{out[k]=a&&typeof a[k]==='object'&&!Array.isArray(a[k])&&typeof b[k]==='object'&&!Array.isArray(b[k])?merge(a[k],b[k]):b[k]});return out}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){for(const k of LEGACY){raw=localStorage.getItem(k);if(raw)break}}return raw?merge(clone(defaults),JSON.parse(raw)):clone(defaults)}catch(e){return clone(defaults)}}let data=load();
function save(msg='自動保存しました'){data.schemaVersion='4.2';localStorage.setItem(KEY,JSON.stringify(data));const s=document.getElementById('saveState');if(s)s.textContent='● 自動保存';if(msg)toast(msg)}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1700)}function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function logged(){try{const s=JSON.parse(localStorage.getItem(SESSION)||sessionStorage.getItem(SESSION)||'null');return s&&s.expires>Date.now()?s:null}catch{return null}}function setLogin(remember){const s={id:'1111',name:'黒坂さん',expires:Date.now()+(remember?30:1)*86400000};sessionStorage.setItem(SESSION,JSON.stringify(s));if(remember)localStorage.setItem(SESSION,JSON.stringify(s));else localStorage.removeItem(SESSION)}function unlock(){document.getElementById('auth').classList.add('off');document.getElementById('app').classList.remove('hidden');renderAll()}function lock(){document.getElementById('app').classList.add('hidden');document.getElementById('auth').classList.remove('off')}
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('id')==='1111'&&f.get('password')==='sffddt1211'){document.getElementById('loginError').classList.remove('show');setLogin(Boolean(f.get('remember')));unlock()}else{const x=document.getElementById('loginError');x.textContent='個人IDまたはパスワードが違います';x.classList.add('show')}});document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem(SESSION);sessionStorage.removeItem(SESSION);lock()};
function ui(){try{return JSON.parse(localStorage.getItem(UIKEY)||'{}')}catch{return {}}}function setUi(p){localStorage.setItem(UIKEY,JSON.stringify({...ui(),...p}))}function applySidebar(){const collapsed=Boolean(ui().sidebarCollapsed);document.body.classList.toggle('sidebar-collapsed',collapsed);document.getElementById('sidebarToggle').textContent=collapsed?'☰':'☰'}document.getElementById('sidebarToggle').onclick=()=>{setUi({sidebarCollapsed:!document.body.classList.contains('sidebar-collapsed')});applySidebar()};
const tooltip=document.getElementById('tooltip');document.querySelectorAll('.nav').forEach(n=>{n.addEventListener('mouseenter',e=>{if(!document.body.classList.contains('sidebar-collapsed'))return;tooltip.textContent=n.dataset.tip;const r=n.getBoundingClientRect();tooltip.style.left=(r.right+8)+'px';tooltip.style.top=(r.top+7)+'px';tooltip.style.display='block'});n.addEventListener('mouseleave',()=>tooltip.style.display='none')});
function setFlow(step){const order=['today','practice','interview','update'];document.querySelectorAll('.flow-step').forEach(x=>x.classList.toggle('active',x.dataset.step===step));setUi({flow:step})}function showPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const p=document.getElementById('page-'+name);if(p)p.classList.add('active');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));if(['home','practice','interview','update'].includes(name))setFlow(name==='home'?'today':name);else setFlow('today');window.scrollTo(0,0);setUi({page:name})}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
function positionHtml(){return `<div class='position-card'><div class='card-title'>CURRENT POSITION</div><div class='position-head'><div><h2>顔まわり設計</h2><span class='small' style='color:var(--muted)'>理解から設計への変換</span></div><b>${data.current.percent}%</b></div><div class='progress'><span style='width:${data.current.percent}%'></span></div><div class='position-list'>${data.current.status.map((x,i)=>`<div class='position-item ${x.state}'><span class='state-dot'>${x.state==='done'?'✓':i+1}</span><span>${esc(x.label)}</span><span class='pill ${x.state==='done'?'green':x.state==='current'?'blue':''}'>${x.state==='done'?'確認済み':x.state==='current'?'今ここ':x.state==='next'?'次':'未確認'}</span></div>`).join('')}</div></div>`}
function renderHome(){document.getElementById('page-home').innerHTML=`<div class='page-head'><div><div class='eyebrow'>THINK LESS. EXPERIENCE MORE.</div><h1>今日の一問</h1><p class='lead'>迷わず進めるように、今日見ることを一つに絞っています。</p></div><div class='auto-save'><span class='dot'></span>自動保存</div></div><section class='main-story'><div class='story-copy'><div class='story-kicker'><b>MAIN STORY / TODAY'S ISSUE</b><span class='pill blue'>VISIONに接続</span></div><div class='question'>今日は一つだけ、<br>観察してください。</div><p class='story-desc'>${esc(data.issue.question)}に答えるための経験だけを行います。結果の良し悪しではなく、どこで判断が分かれたかが分かれば完了です。</p><div class='story-foot'><div class='chips'><span class='chip'>見る一点：${esc(data.issue.focus)}</span><span class='chip'>終了条件：${esc(data.issue.finish)}</span></div><button id='startPractice' class='primary'>Practiceを始める</button></div></div>${positionHtml()}</section><div class='bento mobile-carousel'><article class='card span-5'><div class='card-title'>RECENT GROWTH</div><div class='growth-quote'>骨格を見るだけでなく、完成像へつなげて考えられた。</div><p>昨日のPracticeで確認</p><button class='mini-link' data-page='feed'>成長を見る →</button></article><article class='card span-4'><div class='card-title'>SELECTED JOURNEY</div><div class='journey-line'>${data.journey.route.join(' → ')}</div><p>${esc(data.journey.reason)}</p><button class='mini-link' data-page='journey'>ルートを見る →</button></article><article class='card span-3'><div class='card-title'>NOT TODAY</div><h3>考えなくていいこと</h3><div class='not-today'><span class='chip'>完璧な答え</span><span class='chip'>他の課題</span><span class='chip'>点数</span></div></article></div>`;document.getElementById('startPractice').onclick=()=>{data.practice.status='practicing';data.practice.startedAt=new Date().toISOString();save('Practiceを開始しました');renderPractice();showPage('practice')};document.querySelectorAll('#page-home [data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page))}
function renderPractice(){document.getElementById('page-practice').innerHTML=`<div class='page-head'><div><div class='eyebrow'>STEP 2 / PRACTICE</div><h1>今日の一点だけに集中する</h1><p class='lead'>他の情報は隠し、必要な操作だけを表示します。</p></div><span class='pill blue'>PRACTICING</span></div><div class='practice-layout'><article class='card practice-main'><div class='card-title'>TODAY'S ISSUE</div><h2 style='font-size:28px'>${esc(data.issue.question)}</h2><div class='practice-steps'><div class='practice-step'><span class='step-number'>1</span><div><h3>完成像を言葉にする</h3><p>どんなシルエットにしたいか、一文で整理します。</p></div></div><div class='practice-step'><span class='step-number'>2</span><div><h3>最短点・最長点を指す</h3><p>骨格との関係を確認しながら位置を決めます。</p></div></div><div class='practice-step'><span class='step-number'>3</span><div><h3>理由を説明する</h3><p>なぜその位置なのか、Supportへ説明します。</p></div></div></div><div class='evidence-drop'><b>Evidenceを追加</b><br><span class='small'>写真・動画・短いメモを残します。</span><div style='margin-top:12px'><button id='addEvidence' class='secondary'>＋ メモを追加</button></div></div></article><aside class='card'><div class='card-title'>TODAY'S FOCUS</div><h3>見る一点</h3><p>${esc(data.issue.focus)}</p><div style='height:20px'></div><h3>終了条件</h3><p>${esc(data.issue.finish)}</p><div style='height:20px'></div><span class='pill blue'>L2｜質問支援</span></aside></div><div class='sticky-actions'><button class='secondary' data-page='home'>Todayへ戻る</button><button id='finishPractice' class='primary'>Practiceを終了</button></div>`;document.getElementById('addEvidence').onclick=()=>{const memo=prompt('短いメモを入力してください');if(memo){data.practice.evidence.push({id:'ev-'+Date.now(),type:'memo',text:memo,date:new Date().toISOString()});save('Evidenceを追加しました');renderPractice()}};document.getElementById('finishPractice').onclick=()=>{data.practice.status='interviewing';data.practice.endedAt=new Date().toISOString();save('Practiceを終了しました');renderInterview();showPage('interview')};document.querySelectorAll('#page-practice [data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page))}
function renderInterview(){const i=data.interview.index;document.getElementById('page-interview').innerHTML=`<div class='page-head'><div><div class='eyebrow'>STEP 3 / GROWTH INTERVIEW</div><h1>今日の経験を整理する</h1><p class='lead'>評価ではありません。次に見る一点を見つけます。</p></div></div><article class='interview-card'><div class='question-count'>QUESTION ${i+1} / ${data.interview.questions.length}</div><h2>${esc(data.interview.questions[i])}</h2><p style='color:var(--muted)'>結果ではなく、実際に起きたことを一つだけ記録してください。</p><textarea id='answerBox' class='answer-box' placeholder='ここに回答を入力'>${esc(data.interview.answers[i])}</textarea><div class='answer-modes'><button class='mode active'>文字で答える</button><button class='mode'>写真を選ぶ</button><button class='mode'>比較して答える</button><button class='mode' id='unknownBtn'>分からない</button></div><div class='q-progress'><span style='width:${((i+1)/data.interview.questions.length)*100}%'></span></div><div class='interview-nav'><button id='prevQ' class='secondary' ${i===0?'disabled':''}>戻る</button><button id='nextQ' class='primary'>${i===data.interview.questions.length-1?'整理を完了':'次へ'}</button></div></article>`;document.getElementById('unknownBtn').onclick=()=>{document.getElementById('answerBox').value='分からない。Practice中に判断点を記録する必要がある。'};document.getElementById('prevQ').onclick=()=>{data.interview.answers[i]=document.getElementById('answerBox').value.trim();data.interview.index=Math.max(0,i-1);save('回答を保存しました');renderInterview()};document.getElementById('nextQ').onclick=()=>{data.interview.answers[i]=document.getElementById('answerBox').value.trim();if(i<data.interview.questions.length-1){data.interview.index=i+1;save('回答を保存しました');renderInterview()}else{completeLoop()}}}
function completeLoop(){const now=new Date().toISOString();const learned=data.interview.answers[0]&&data.interview.answers[0]!=='分からない。Practice中に判断点を記録する必要がある。'?'完成像ではなく、現在の毛先を安全基準にしていた。':'判断が分かれた瞬間をPractice中に記録する必要がある。';const next='決めた最短点を、最初のパネルまで維持する。';data.lastUpdate={date:now,learned,next};data.current.percent=Math.min(100,data.current.percent+4);data.feed.unshift({id:'feed-'+Date.now(),date:now.slice(0,10),change:learned,evidence:`Interview＋Evidence ${data.practice.evidence.length}件`});data.archive.unshift({id:'arc-'+Date.now(),date:now,issue:clone(data.issue),practice:clone(data.practice),interview:clone(data.interview),learned,next});data.practice={status:'ready',evidence:[],startedAt:null,endedAt:null};data.interview.index=0;data.interview.answers=['','',''];save('Current Positionを更新しました');renderAll();showPage('update')}
function renderUpdate(){const u=data.lastUpdate||{learned:'今回の経験が整理されました。',next:'次のPracticeを確認します。'};document.getElementById('page-update').innerHTML=`<div class='page-head'><div><div class='eyebrow'>STEP 4 / UPDATE</div><h1>Current Position Updated</h1><p class='lead'>結果ではなく、地図が一段明確になりました。</p></div></div><section class='update-hero'><span class='pill blue'>今回分かったこと</span><h2>${esc(u.learned)}</h2><div class='update-grid'><article class='card'><div class='card-title'>CURRENT POSITION</div>${positionHtml()}</article><article class='card'><div class='card-title'>NEXT PRACTICE</div><div class='update-message'>${esc(u.next)}</div><p style='margin-top:12px'>次は一つの条件だけを変えて検証します。</p></article></div><div style='display:flex;justify-content:flex-end;margin-top:20px'><button id='completeToday' class='primary'>Todayを完了する</button></div></section>`;document.getElementById('completeToday').onclick=()=>{save('Todayを完了しました');renderHome();showPage('home')}}
function renderInbox(){const unread=data.inbox.filter(x=>x.status==='unread').length;document.getElementById('inboxBadge').textContent=unread;document.getElementById('inboxBadge').classList.toggle('hidden',!unread);document.getElementById('page-inbox').innerHTML=`<div class='page-head'><div><div class='eyebrow'>GROWTH INBOX</div><h1>Supportから届いた提案</h1><p class='lead'>判断を一方的に反映せず、内容を確認してから次へ進みます。</p></div></div><div class='inbox-list'>${data.inbox.length?data.inbox.map(x=>`<article class='inbox-item ${x.status==='unread'?'unread':''}'><div class='item-top'><div><b>${esc(x.title)}</b><div style='font-size:12px;color:var(--muted)'>${esc(x.from)}｜${esc(x.date)}</div></div><span class='pill ${x.status==='accepted'?'green':'blue'}'>${x.status==='accepted'?'承認済み':x.status==='declined'?'保留':'未確認'}</span></div><p>${esc(x.message)}</p><div class='card' style='margin-top:12px;background:#f8fafd'><div class='card-title'>提案された次のPractice</div><b>${esc(x.proposal?.next||'')}</b></div><div class='item-actions'>${x.status==='unread'?`<button class='primary' data-accept='${x.id}'>承認する</button><button class='secondary' data-hold='${x.id}'>保留</button>`:''}</div></article>`).join(''):`<div class='empty'>新しい提案はありません。</div>`}</div>`;document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{const x=data.inbox.find(v=>v.id===b.dataset.accept);if(x){x.status='accepted';data.lastUpdate={date:new Date().toISOString(),learned:'Support提案を確認し、次のPracticeを自分で選択した。',next:x.proposal.next};data.feed.unshift({id:'feed-'+Date.now(),date:new Date().toISOString().slice(0,10),change:'Support提案を確認し、次のPracticeを選択した。',evidence:'Growth Inbox'});save('提案を承認しました');renderAll()}});document.querySelectorAll('[data-hold]').forEach(b=>b.onclick=()=>{const x=data.inbox.find(v=>v.id===b.dataset.hold);if(x){x.status='declined';save('提案を保留しました');renderAll()}})}
function renderFeed(){document.getElementById('page-feed').innerHTML=`<div class='page-head'><div><div class='eyebrow'>GROWTH FEED</div><h1>したことではなく、変わったこと</h1><p class='lead'>認識・判断・現在地の変化だけを残します。</p></div></div><div class='feed-list'>${data.feed.map(x=>`<article class='feed-item'><div class='item-top'><span class='pill green'>GROWTH UPDATE</span><small style='color:var(--muted)'>${esc(x.date)}</small></div><div class='feed-change'>${esc(x.change)}</div><p>Evidence：${esc(x.evidence)}</p></article>`).join('')}</div>`}
function renderJourney(){document.getElementById('page-journey').innerHTML=`<div class='page-head'><div><div class='eyebrow'>SELECTED JOURNEY</div><h1>自分で選んだ進み方</h1><p class='lead'>最短ルートではなく、理解しやすい順番を選びます。</p></div></div><article class='card'><div class='journey-track'>${data.journey.route.map((x,i)=>`<div class='journey-step ${i<data.journey.current?'done':i===data.journey.current?'current':''}'><span class='jdot'>${i<data.journey.current?'✓':i+1}</span><b>${esc(x)}</b><div style='font-size:11px;color:var(--muted)'>${i<data.journey.current?'確認済み':i===data.journey.current?'今ここ':'次'}</div></div>`).join('')}</div><div style='margin-top:28px;padding-top:20px;border-top:1px solid var(--line)'><div class='card-title'>ROUTE REASON</div><p>${esc(data.journey.reason)}</p></div></article>`}
function renderArchive(){document.getElementById('page-archive').innerHTML=`<div class='page-head'><div><div class='eyebrow'>THINKING ARCHIVE</div><h1>判断が変化した履歴</h1><p class='lead'>OSを更新しても、当時の問い・回答・再解釈を残します。</p></div></div><div class='archive-toolbar'><button class='filter active'>すべて</button><button class='filter'>Issue</button><button class='filter'>Interview</button><button class='filter'>Update</button></div><div class='archive-list'>${data.archive.length?data.archive.map(x=>`<article class='archive-item'><div class='item-top'><span class='pill purple'>LOOP ARCHIVE</span><small style='color:var(--muted)'>${new Date(x.date).toLocaleString('ja-JP')}</small></div><h3>${esc(x.issue.question)}</h3><p><b>分かったこと：</b>${esc(x.learned)}</p><p><b>次に見ること：</b>${esc(x.next)}</p><details><summary>当時の回答を見る</summary><ol>${x.interview.answers.map(a=>`<li>${esc(a||'未回答')}</li>`).join('')}</ol></details></article>`).join(''):`<div class='empty'>最初のGrowth Loopを完了すると、ここに履歴が追加されます。</div>`}</div>`}
function renderLibrary(){document.getElementById('page-library').innerHTML=`<div class='page-head'><div><div class='eyebrow'>LIBRARY</div><h1>次の経験に使う資料</h1><p class='lead'>資料を集めるためではなく、Issueを検証するために使います。</p></div></div><div class='bento'>${data.library.map(x=>`<article class='card span-4'><span class='pill blue'>${esc(x.type)}</span><h3>${esc(x.title)}</h3><p>${esc(x.note)}</p><button class='mini-link'>開く →</button></article>`).join('')}</div>`}
function renderVision(){document.getElementById('page-vision').innerHTML=`<div class='page-head'><div><div class='eyebrow'>VISION</div><h1>どこへ向かうか</h1><p class='lead'>JourneyとIssueを判断する基準です。</p></div></div><div class='bento'><article class='card span-7'><div class='card-title'>DESTINATION</div><h2>${esc(data.vision.text)}</h2><p>${esc(data.vision.reason)}</p></article><article class='card span-5'><div class='card-title'>NON-GOAL</div><h3>目指さない状態</h3><p>${esc(data.vision.nonGoal)}</p></article></div>`}
function renderCore(){document.getElementById('page-core').innerHTML=`<div class='page-head'><div><div class='eyebrow'>CORE</div><h1>経験から形成される自分の軸</h1><p class='lead'>性格診断ではなく、繰り返し現れた選択を記録します。</p></div></div><div class='bento'><article class='card span-4'><div class='card-title'>WANT</div><h3>${esc(data.core.want)}</h3></article><article class='card span-4'><div class='card-title'>IS</div><h3>${esc(data.core.is)}</h3></article><article class='card span-4'><div class='card-title'>MUST</div><h3>${esc(data.core.must)}</h3></article></div>`}
function renderAll(){renderHome();renderPractice();renderInterview();renderUpdate();renderInbox();renderFeed();renderJourney();renderArchive();renderLibrary();renderVision();renderCore();applySidebar();const p=ui().page||'home';showPage(document.getElementById('page-'+p)?p:'home')}
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='growth-os-staff-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('バックアップを書き出しました')};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=merge(clone(defaults),JSON.parse(r.result));save('データを読み込みました');renderAll()}catch{toast('JSONを読み込めませんでした')}};r.readAsText(f)};
window.addEventListener('resize',()=>{if(innerWidth<=760)tooltip.style.display='none'});if(logged())unlock();else lock();applySidebar();
</script>
