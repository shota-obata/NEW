const KEY='growthOS.support.v4.3',STAFF_KEY='growthOS.data.v4',SESSION='growthOS.support.session',UIKEY='growthOS.support.ui.v4.3';
const defaults={schemaVersion:'4.3',profile:{id:'support',name:'小畑 昭汰',store:'LOVEST KYOTO'},selectedStaff:'staff-k',staff:[{id:'staff-k',name:'黒坂さん',role:'アシスタント',domain:'カット育成',signal:'help',updated:'4分前',vision:'骨格と髪質を見ながら、顔まわりを自在に設計できる美容師',current:46,activeIssue:'異なる骨格でも、完成像から最短点と最長点を設定できるか？',journey:['写真比較','骨格を言語化','基準点を設計','モデル実践'],journeyCurrent:2},{id:'staff-n',name:'西村さん',role:'アシスタント',domain:'接客育成',signal:'ok',updated:'2時間前',vision:'お客様の言葉を整理し、安心できる選択肢を提示する美容師',current:71,activeIssue:'希望の曖昧さを質問で具体化できるか？',journey:['事例比較','質問設計','ロールプレイ','実客'],journeyCurrent:3},{id:'staff-t',name:'田中さん',role:'スタイリスト',domain:'カラー育成',signal:'watch',updated:'昨日',vision:'素材条件から色の残留を予測できる美容師',current:63,activeIssue:'残留色素を次回設計へ反映できるか？',journey:['履歴整理','残留予測','薬剤設計','検証'],journeyCurrent:2}],issues:[{id:'issue-primary',role:'PRIMARY',question:'異なる骨格でも、完成像から最短点と最長点を設定できるか？',vision:'関連Issue 4件へ波及',evidence:'異条件で2回崩れ',journey:'写真比較ルートと適合',status:'Today’s Issue候補'},{id:'issue-observe',role:'OBSERVE',question:'引き出し角度を安定して維持できるか？',vision:'波及度 低',evidence:'最近覚えた技術',journey:'初期揺れの可能性',status:'経過観察'},{id:'issue-pattern',role:'PATTERN',question:'時間が押した時も中間確認を省略しないか？',vision:'再発時の影響 中',evidence:'類似2件',journey:'条件付きで観察',status:'Deferred'}],selectedIssue:'issue-primary',evidence:{practice:'Practice #024',decisionPoint:'最初のパネルを切る直前',observed:'現在の毛先／設定済みの最短点',prioritized:'現在の毛先',gaps:['Criteria Gap','State Gap'],unrefuted:['Execution Gap'],basis:'本人回答＋Practice動画＋類似2件'},requests:[{id:'req-1',from:'黒坂さん',title:'Journeyを確認したい',body:'写真比較だけでは構造がつながりにくいです。',status:'new',due:'今日'},{id:'req-2',from:'管理',title:'店舗共通Issueの確認',body:'観察から設計への変換で止まる人数を確認してください。',status:'in_progress',due:'7/26'},{id:'req-3',from:'河原町店',title:'動画Evidenceの確認',body:'接客動画の判断点を確認してください。',status:'resolved_wait',due:'今日'}],decisions:[],outbox:[],library:[{id:'sl-1',title:'顔まわり設計｜基準点',type:'展開図',note:'最短点・最長点・接続位置を確認する。'},{id:'sl-2',title:'骨格比較 3パターン',type:'比較資料',note:'異なる条件で完成像を言語化する。'},{id:'sl-3',title:'Support質問例',type:'Interview',note:'判断点・見ていた情報・基準を切り分ける。'}]};
function clone(x){return JSON.parse(JSON.stringify(x))}function merge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a;const out={...a};Object.keys(b||{}).forEach(k=>{out[k]=a&&typeof a[k]==='object'&&!Array.isArray(a[k])&&typeof b[k]==='object'&&!Array.isArray(b[k])?merge(a[k],b[k]):b[k]});return out}function load(){try{const raw=localStorage.getItem(KEY);return raw?merge(clone(defaults),JSON.parse(raw)):clone(defaults)}catch{return clone(defaults)}}let data=load();
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1800)}function save(msg='自動保存しました'){data.schemaVersion='4.3';localStorage.setItem(KEY,JSON.stringify(data));if(msg)toast(msg)}
function logged(){try{const s=JSON.parse(localStorage.getItem(SESSION)||sessionStorage.getItem(SESSION)||'null');return s&&s.expires>Date.now()?s:null}catch{return null}}function setLogin(remember){const s={id:'support',name:'小畑 昭汰',expires:Date.now()+(remember?30:1)*86400000};sessionStorage.setItem(SESSION,JSON.stringify(s));if(remember)localStorage.setItem(SESSION,JSON.stringify(s));else localStorage.removeItem(SESSION)}function unlock(){document.getElementById('auth').classList.add('off');document.getElementById('app').classList.remove('hidden');renderAll()}function lock(){document.getElementById('app').classList.add('hidden');document.getElementById('auth').classList.remove('off')}
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('id')==='support'&&f.get('password')==='support1211'){document.getElementById('loginError').classList.remove('show');setLogin(Boolean(f.get('remember')));unlock()}else{const x=document.getElementById('loginError');x.textContent='Support IDまたはパスワードが違います';x.classList.add('show')}});document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem(SESSION);sessionStorage.removeItem(SESSION);lock()};
function ui(){try{return JSON.parse(localStorage.getItem(UIKEY)||'{}')}catch{return {}}}function setUi(p){localStorage.setItem(UIKEY,JSON.stringify({...ui(),...p}))}function applySidebar(){document.body.classList.toggle('sidebar-collapsed',Boolean(ui().sidebarCollapsed))}document.getElementById('sidebarToggle').onclick=()=>{setUi({sidebarCollapsed:!document.body.classList.contains('sidebar-collapsed')});applySidebar()};const tooltip=document.getElementById('tooltip');document.querySelectorAll('.nav').forEach(n=>{n.addEventListener('mouseenter',()=>{if(!document.body.classList.contains('sidebar-collapsed'))return;tooltip.textContent=n.dataset.tip;const r=n.getBoundingClientRect();tooltip.style.left=(r.right+8)+'px';tooltip.style.top=(r.top+7)+'px';tooltip.style.display='block'});n.addEventListener('mouseleave',()=>tooltip.style.display='none')});
function selectedStaff(){return data.staff.find(x=>x.id===data.selectedStaff)||data.staff[0]}function selectedIssue(){return data.issues.find(x=>x.id===data.selectedIssue)||data.issues[0]}function signalText(s){return s==='ok'?'順調':s==='watch'?'観察':'支援候補'}function signalClass(s){return s==='ok'?'green':s==='watch'?'yellow':'red'}
function setFlow(page){const map={today:'today',workspace:'workspace',issue:'issue',evidence:'evidence',decision:'decision'};document.querySelectorAll('.flow-step').forEach(x=>x.classList.toggle('active',x.dataset.step===(map[page]||'today')))}function showPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const p=document.getElementById('page-'+name);if(p)p.classList.add('active');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));setFlow(name);setUi({page:name});window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
function renderToday(){const s=selectedStaff();const pending=data.requests.filter(x=>x.status!=='resolved').length;document.getElementById('page-today').innerHTML=`<div class="page-head"><div><div class="eyebrow">TEAM SUPPORT / MAIN STORY</div><h1>Support Today</h1><p class="lead">今日、誰のどのIssueを深掘るべきか。</p></div><div class="auto-save"><span class="dot"></span>自動保存</div></div><section class="main-story"><div class="story-copy"><div class="story-kicker"><b>DEEP DIVE PRIORITY</b><span class="pill red">優先度 高</span></div><div class="story-person"><div class="avatar">黒</div><div><b>${esc(s.name)}</b><div style="font-size:12px;color:var(--muted)">${esc(s.role)}｜${esc(s.domain)}</div></div></div><div class="story-question">完成像から基準点へ<br>変換できない可能性</div><p class="story-desc">他4件のIssueへ波及します。次のPracticeで、RecognitionとPlanningを切り分けられます。</p><div class="story-foot"><div class="chips"><span class="chip">Evidence 3件</span><span class="chip">確信度 中</span><span class="chip">次回検証可能</span></div><button id="openWorkspace" class="primary">診断を開く</button></div></div><aside class="summary-card"><div class="card-title">TODAY'S SUPPORT LOAD</div><h2>判断待ち</h2><div class="metric-row"><div class="metric"><b>3</b><small>Evidence</small></div><div class="metric"><b>${pending}</b><small>Requests</small></div><div class="metric"><b>1</b><small>Journey候補</small></div><div class="metric"><b>2</b><small>Recognition更新</small></div></div><span class="pill green">Support負荷は安定</span></aside></section><div class="bento mobile-carousel"><article class="card span-4"><div class="card-title">EVIDENCE REVIEW</div><h2>判断待ち 3件</h2><div class="list"><div class="list-item"><div><b>黒坂｜設計写真＋説明</b><small>Planning候補</small></div><span class="pill red">優先</span></div><div class="list-item"><div><b>西村｜接客動画 02:14</b><small>Criteria候補</small></div></div><div class="list-item"><div><b>田中｜仕上がり比較</b><small>反証Evidence</small></div></div></div><button class="mini-link" data-page="evidence">Evidenceを確認 →</button></article><article class="card span-4"><div class="card-title">REQUESTS</div><h2>解決待ち ${pending}件</h2><div class="list">${data.requests.slice(0,3).map(x=>`<div class="list-item"><div><b>${esc(x.from)}</b><small>${esc(x.title)}</small></div><span class="pill ${x.status==='new'?'red':x.status==='in_progress'?'yellow':'green'}">${x.status==='new'?'新着':x.status==='in_progress'?'対応中':'確認待ち'}</span></div>`).join('')}</div><button class="mini-link" data-page="requests">Requestsを見る →</button></article><article class="card span-4"><div class="card-title">JOURNEY CHANGES</div><span class="pill blue">本人から</span><h2>展開図ルートを補助として追加</h2><p>写真比較だけでは構造がつながりにくい。本人合意待ち。</p><button class="mini-link" data-page="workspace">Journeyを確認 →</button></article></div>`;document.getElementById('openWorkspace').onclick=()=>showPage('workspace');document.querySelectorAll('#page-today [data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page))}
function renderWorkspace(){const s=selectedStaff();document.getElementById('page-workspace').innerHTML=`<div class="page-head"><div><div class="eyebrow">STAFF WORKSPACE</div><h1>一人の情報を、一つの判断へ</h1><p class="lead">Vision・Journey・Issue・Evidenceを同じ文脈で確認します。</p></div></div><div class="staff-layout"><aside class="staff-list"><div class="staff-list-head"><b>担当スタッフ</b><small>${data.staff.length}人</small></div><input class="staff-search" placeholder="名前・Issueで検索">${data.staff.map(x=>`<button class="staff-row ${x.id===data.selectedStaff?'active':''}" data-staff="${x.id}"><span class="avatar">${esc(x.name.slice(0,1))}</span><span><b>${esc(x.name)}</b><small>${esc(x.domain)}</small></span><span class="pill ${signalClass(x.signal)}">${signalText(x.signal)}</span></button>`).join('')}</aside><div class="staff-detail"><section class="staff-hero"><div class="staff-person"><div class="avatar" style="width:54px;height:54px">${esc(s.name.slice(0,1))}</div><div><h2 style="margin:0">${esc(s.name)}</h2><div style="color:var(--muted);font-size:12px">${esc(s.role)}｜${esc(s.domain)}</div></div></div><div class="chips"><span class="pill blue">Current Position ${s.current}%</span><span class="pill red">Active Issue 1</span></div></section><div class="staff-tabs"><button class="tab active">Overview</button><button class="tab">Journey</button><button class="tab">Issue Staircase</button><button class="tab">Issue Graph</button><button class="tab">Evidence</button><button class="tab">Interview</button><button class="tab">Archive</button></div><div class="workspace-grid"><article class="card"><div class="card-title">VISION</div><h2>${esc(s.vision)}</h2><p>現在のIssueとJourneyを判断する基準。</p></article><article class="card"><div class="card-title">ACTIVE ISSUE</div><h2>${esc(s.activeIssue)}</h2><button id="openIssue" class="primary" style="margin-top:14px">Issue Review</button></article><article class="card"><div class="card-title">CURRENT POSITION</div><h3>Visionに対する現在地</h3><div class="status-row"><span>完成像を言語化</span><span class="pill green">Confirmed</span></div><div class="progress"><span style="width:72%"></span></div><div class="status-row"><span>基準点へ変換</span><span class="pill blue">Supported</span></div><div class="progress"><span style="width:46%"></span></div><div class="status-row"><span>異条件へ転移</span><span class="pill yellow">Unverified</span></div><div class="progress"><span style="width:18%"></span></div></article><article class="card"><div class="card-title">SELECTED JOURNEY</div><h3>${s.journey.join(' → ')}</h3><p>補助ルート候補：展開図を一時追加。本人合意待ち。</p><button class="mini-link">提案内容を見る →</button></article></div></div></div>`;document.querySelectorAll('[data-staff]').forEach(b=>b.onclick=()=>{data.selectedStaff=b.dataset.staff;save('スタッフを切り替えました');renderAll();showPage('workspace')});document.getElementById('openIssue').onclick=()=>showPage('issue')}
function renderIssue(){document.getElementById('page-issue').innerHTML=`<div class="page-head"><div><div class="eyebrow">ISSUE REVIEW</div><h1>今扱う価値のある一問へ絞る</h1><p class="lead">最大3件を比較し、AIの推奨をSupportが判断します。</p></div></div><div class="issue-grid">${data.issues.map((x,i)=>`<article class="issue-card ${x.id===data.selectedIssue?'primary-card':''}"><span class="pill ${i===0?'blue':i===1?'yellow':'purple'}">${esc(x.role)}</span><div class="issue-question">${esc(x.question)}</div><div class="issue-facts"><div class="fact"><small>Visionへの接続</small><b>${esc(x.vision)}</b></div><div class="fact"><small>Evidence</small><b>${esc(x.evidence)}</b></div><div class="fact"><small>Journey Fit</small><b>${esc(x.journey)}</b></div><div class="fact"><small>現在の扱い</small><b>${esc(x.status)}</b></div></div><div class="issue-actions"><button class="${x.id===data.selectedIssue?'primary':'secondary'}" data-select-issue="${x.id}">${x.id===data.selectedIssue?'選択中':'このIssueを選ぶ'}</button></div></article>`).join('')}</div><article class="card" style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap"><div><div class="card-title">RECOMMENDATION</div><b>Primary候補を本人へ平易な言葉で提示する前に、Evidenceを確認する。</b></div><button id="toEvidence" class="primary">Evidence Reviewへ</button></article>`;document.querySelectorAll('[data-select-issue]').forEach(b=>b.onclick=()=>{data.selectedIssue=b.dataset.selectIssue;save('Issue候補を選択しました');renderIssue()});document.getElementById('toEvidence').onclick=()=>showPage('evidence')}
function renderEvidence(){const e=data.evidence;document.getElementById('page-evidence').innerHTML=`<div class="page-head"><div><div class="eyebrow">EVIDENCE REVIEW</div><h1>事実と仮説を分ける</h1><p class="lead">ProcessとOutcomeを時間軸でつなぎ、Issueへの答えを判断します。</p></div></div><div class="evidence-layout"><section class="media-card"><div class="card-title">${esc(e.practice)} / 黒坂さん</div><h2>${esc(selectedIssue().question)}</h2><div class="video-stage"><div class="play">▶</div><span class="video-label">Practice video 02:14</span></div><div class="evidence-strip"><article class="evidence-thumb"><div class="card-title">DESIGN</div><b>設計写真</b><p>最短点を事前設定</p></article><article class="evidence-thumb"><div class="card-title">OUTCOME</div><b>仕上がり</b><p>設定より +2cm</p></article><article class="evidence-thumb"><div class="card-title">INTERVIEW</div><b>本人回答</b><p>安全を優先した</p></article></div><div class="timeline"><div class="card-title">DECISION TIMELINE</div><div class="timeline-bar"><div class="timeline-fill"></div><span class="timeline-pin"></span></div><p style="margin-top:8px;color:var(--muted)">01:26｜判断を変更した可能性</p></div></section><aside class="diagnostic"><div class="card-title">DIAGNOSTIC OUTPUT</div><p>AI仮説はSupportが確定します。</p><dl><dt>判断点</dt><dd>${esc(e.decisionPoint)}</dd><div class="divider"></div><dt>見ていた情報</dt><dd>${esc(e.observed)}</dd><dt>優先した情報</dt><dd>${esc(e.prioritized)}</dd><div class="divider"></div><dt>Gap候補</dt><dd>${e.gaps.map(x=>`<span class="pill blue">${esc(x)}</span>`).join(' ')}</dd><dt>未反証</dt><dd>${e.unrefuted.map(x=>`<span class="pill yellow">${esc(x)}</span>`).join(' ')}</dd><dt>根拠</dt><dd>${esc(e.basis)}</dd></dl><button id="toDecision" class="primary" style="width:100%;margin-top:24px">Support Decisionへ</button></aside></div>`;document.getElementById('toDecision').onclick=()=>showPage('decision')}
function renderDecision(){const s=selectedStaff(),issue=selectedIssue();document.getElementById('page-decision').innerHTML=`<div class="page-head"><div><div class="eyebrow">SUPPORT DECISION</div><h1>次の経験へ返す判断を確定する</h1><p class="lead">診断名ではなく、スタッフが次に見られる一文へ変換します。</p></div></div><div class="decision-layout"><form id="decisionForm" class="decision-form"><div class="field"><label>Issue Decision</label><select name="decision"><option>Partial｜一部支持</option><option>Confirmed｜支持</option><option>Refuted｜反証</option><option>Unresolved｜未解決</option><option>Reframed｜問いを再構成</option></select></div><div class="field"><label>Primary Gap</label><select name="gap"><option>Criteria Gap</option><option>Planning Gap</option><option>Recognition Gap</option><option>Execution Gap</option><option>Monitoring Gap</option><option>State Gap</option></select></div><div class="field"><label>今回分かったこと</label><textarea name="learned">完成像ではなく、現在の毛先を安全基準として優先していた。</textarea></div><div class="field"><label>次のPractice</label><textarea name="next">決めた最短点を、最初のパネルまで維持する。</textarea></div><div class="field"><label>スタッフへ送るメッセージ</label><textarea name="message">完成像を決めるところまでは確認できました。次は、決めた位置を最初の操作まで維持できるかを一緒に見ます。</textarea></div><label style="display:flex;gap:8px;align-items:center;font-size:12px"><input name="send" type="checkbox" checked style="width:auto">Growth Inboxへ送信する</label><div class="form-actions"><button type="button" id="holdDecision" class="secondary">保留</button><button class="primary">判断を確定</button></div></form><aside class="decision-preview"><span class="pill green">STAFF VIEW</span><h2>今回分かったこと</h2><p style="font-size:18px;font-weight:800">完成像ではなく、現在の毛先を安全基準として優先していた。</p><div style="height:1px;background:var(--line);margin:18px 0"></div><div class="card-title">NEXT PRACTICE</div><p style="font-size:18px;font-weight:800">決めた最短点を、最初のパネルまで維持する。</p><div class="checklist"><div class="check-item"><span class="checkmark">✓</span><span>Thinking Archiveへ追記</span></div><div class="check-item"><span class="checkmark">✓</span><span>Issue Graph更新候補を保存</span></div><div class="check-item"><span class="checkmark">✓</span><span>Current Position更新候補を保存</span></div><div class="check-item"><span class="checkmark">✓</span><span>本人承認までは未確定</span></div></div></aside></div>`;document.getElementById('holdDecision').onclick=()=>toast('判断を保留しました');document.getElementById('decisionForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const record={id:'decision-'+Date.now(),date:new Date().toISOString(),staffId:s.id,staffName:s.name,issueId:issue.id,issue:issue.question,decision:f.get('decision'),gap:f.get('gap'),learned:f.get('learned').trim(),next:f.get('next').trim(),message:f.get('message').trim(),evidence:clone(data.evidence),status:'confirmed_by_support'};data.decisions.unshift(record);if(f.get('send'))sendToStaff(record);save('Support Decisionを保存しました');renderAll();showPage('archive')}}
function sendToStaff(record){const outbound={id:'support-'+record.id,date:new Date().toISOString().slice(0,10),from:'Team Support',title:'次のPractice提案',message:record.message,status:'unread',proposal:{next:record.next},supportDecisionId:record.id};data.outbox.unshift(outbound);try{const raw=localStorage.getItem(STAFF_KEY);if(raw){const staff=JSON.parse(raw);staff.inbox=Array.isArray(staff.inbox)?staff.inbox:[];staff.inbox.unshift(outbound);staff.supportDecisionCandidates=Array.isArray(staff.supportDecisionCandidates)?staff.supportDecisionCandidates:[];staff.supportDecisionCandidates.unshift(record);localStorage.setItem(STAFF_KEY,JSON.stringify(staff));toast('Growth Inboxへ送信しました')}else{toast('送信キューへ保存しました')}}catch{toast('送信キューへ保存しました')}}
function renderRequests(){document.getElementById('page-requests').innerHTML=`<div class="page-head"><div><div class="eyebrow">REQUESTS</div><h1>既読と解決を分けて管理する</h1><p class="lead">解決は依頼者と対応者の双方確認で成立します。</p></div></div><div class="request-list">${data.requests.map(x=>`<article class="request-item ${x.status==='new'?'unread':''}"><div class="item-top"><div><b>${esc(x.title)}</b><div style="font-size:12px;color:var(--muted)">${esc(x.from)}｜期限 ${esc(x.due)}</div></div><span class="pill ${x.status==='new'?'red':x.status==='in_progress'?'yellow':'green'}">${x.status==='new'?'New':x.status==='in_progress'?'In Progress':'解決確認待ち'}</span></div><p>${esc(x.body)}</p><div class="item-actions"><button class="small-btn" data-req-read="${x.id}">既読</button><button class="small-btn" data-req-progress="${x.id}">対応中</button><button class="small-btn" data-req-resolve="${x.id}">こちら側完了</button></div></article>`).join('')}</div>`;document.querySelectorAll('[data-req-read]').forEach(b=>b.onclick=()=>updateReq(b.dataset.reqRead,'read'));document.querySelectorAll('[data-req-progress]').forEach(b=>b.onclick=()=>updateReq(b.dataset.reqProgress,'in_progress'));document.querySelectorAll('[data-req-resolve]').forEach(b=>b.onclick=()=>updateReq(b.dataset.reqResolve,'resolved_wait'))}
function updateReq(id,status){const x=data.requests.find(v=>v.id===id);if(x){x.status=status;save('Requestを更新しました');renderAll();showPage('requests')}}
function renderArchive(){document.getElementById('page-archive').innerHTML=`<div class="page-head"><div><div class="eyebrow">DECISION ARCHIVE</div><h1>当時の仮説と判断を残す</h1><p class="lead">後から意味が変わっても、当時の版は上書きしません。</p></div></div><div class="archive-list">${data.decisions.length?data.decisions.map(x=>`<article class="archive-item"><div class="item-top"><span class="pill purple">${esc(x.decision)}</span><small style="color:var(--muted)">${new Date(x.date).toLocaleString('ja-JP')}</small></div><h3>${esc(x.staffName)}｜${esc(x.issue)}</h3><p><b>Primary Gap：</b>${esc(x.gap)}</p><p><b>分かったこと：</b>${esc(x.learned)}</p><p><b>次のPractice：</b>${esc(x.next)}</p><details><summary>Evidence basis</summary><p>${esc(x.evidence.basis)}</p></details></article>`).join(''):`<div class="card" style="text-align:center;color:var(--muted);padding:40px">最初のSupport Decisionを確定すると、ここに履歴が追加されます。</div>`}</div>`}
function renderLibrary(){document.getElementById('page-library').innerHTML=`<div class="page-head"><div><div class="eyebrow">SUPPORT LIBRARY</div><h1>Issueを検証するための共有資料</h1><p class="lead">教材の量ではなく、どのIssueへ使うかを明確にします。</p></div></div><div class="bento">${data.library.map(x=>`<article class="card span-4"><span class="pill blue">${esc(x.type)}</span><h3>${esc(x.title)}</h3><p>${esc(x.note)}</p><button class="mini-link">開く →</button></article>`).join('')}</div>`}
function renderAll(){renderToday();renderWorkspace();renderIssue();renderEvidence();renderDecision();renderRequests();renderArchive();renderLibrary();document.getElementById('requestBadge').textContent=data.requests.filter(x=>x.status==='new'||x.status==='in_progress').length;applySidebar();const p=ui().page||'today';showPage(document.getElementById('page-'+p)?p:'today')}
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='growth-os-support-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('バックアップを書き出しました')};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=merge(clone(defaults),JSON.parse(r.result));save('データを読み込みました');renderAll()}catch{toast('JSONを読み込めませんでした')}};r.readAsText(f)};
if(logged())unlock();else lock();applySidebar();
</script>
</body>
</html>
