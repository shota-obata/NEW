<div id="auth" class="auth"><div class="auth-card"><div class="auth-brand"><div class="mark">MG</div><h1>Growth OS</h1><p>Management Intelligence</p></div><div id="loginError" class="login-error"></div><form id="loginForm"><div class="field"><label>Management ID</label><input name="id" required></div><div class="field"><label>パスワード</label><input name="password" type="password" required></div><label style="display:flex;gap:8px;align-items:center;font-size:12px;margin:12px 0 18px"><input name="remember" type="checkbox" checked style="width:auto">ログイン状態を保持</label><button class="primary" style="width:100%">管理画面へ入る</button><div class="demo">デモ：management ／ management1211</div></form></div></div>

<aside class="sidebar"><div class="side-section">INTELLIGENCE</div><button class="nav active" data-page="today" data-tip="Management Today"><span class="nav-icon">⌂</span><span class="nav-label">Management Today</span></button><button class="nav" data-page="intelligence" data-tip="Organization Intelligence"><span class="nav-icon">◈</span><span class="nav-label">Organization Intelligence</span></button><button class="nav" data-page="comparison" data-tip="Store Comparison"><span class="nav-icon">▥</span><span class="nav-label">Store Comparison</span></button><div class="side-section">DECISIONS</div><button class="nav" data-page="intervention" data-tip="Intervention"><span class="nav-icon">◎</span><span class="nav-label">Intervention</span></button><button class="nav" data-page="requests" data-tip="Requests"><span class="nav-icon">↗</span><span class="nav-label">Requests</span><span id="requestBadge" class="badge">2</span></button><button class="nav" data-page="archive" data-tip="Decision Archive"><span class="nav-icon">◷</span><span class="nav-label">Decision Archive</span></button><div class="side-section">GOVERNANCE</div><button class="nav" data-page="privacy" data-tip="Privacy & Scope"><span class="nav-icon">▣</span><span class="nav-label">Privacy & Scope</span></button><div class="sidebar-foot"><button id="exportBtn" class="storage-btn">JSONを書き出す</button><button id="importBtn" class="storage-btn">JSONを読み込む</button><input id="importFile" class="hidden" type="file" accept="application/json"><div style="font-size:10px;color:var(--muted)">schema v4.4<br>集約情報を優先</div></div></aside>

<script>
const KEY='growthOS.management.v4.4',SUPPORT_KEY='growthOS.support.v4.3',SESSION='growthOS.management.session',UIKEY='growthOS.management.ui.v4.4';
const defaults={schemaVersion:'4.4',profile:{id:'management',name:'小畑 昭汰'},selectedStore:'all',stores:[{id:'all',name:'全店舗',staff:24,supportLoad:68,issueRate:42,growth:71},{id:'kawaramachi',name:'河原町店',staff:10,supportLoad:74,issueRate:51,growth:76},{id:'kuzuha',name:'樟葉店',staff:8,supportLoad:61,issueRate:38,growth:69},{id:'other',name:'その他',staff:6,supportLoad:55,issueRate:32,growth:64}],organizationIssue:{title:'観察から設計への変換が、3店舗で共通ボトルネックになっている。',detail:'完成像の認識までは進むが、基準点・操作へ変換する地点で止まるスタッフが多い。',impact:'関連Issue 17件',evidence:'直近30日のPractice 46件',decision:'比較教材と展開図ルートを共通資源として追加する'},gaps:[{name:'Recognition → Planning',value:78,count:11},{name:'Criteria Gap',value:62,count:8},{name:'Monitoring Gap',value:43,count:6},{name:'Execution Gap',value:31,count:4}],journeys:[{name:'写真比較ルート',value:72},{name:'展開図ルート',value:48},{name:'対話ルート',value:39},{name:'反復実践ルート',value:34}],support:[{name:'小畑',load:82,wait:3,deep:5},{name:'酒井',load:64,wait:1,deep:3},{name:'教育担当B',load:57,wait:2,deep:2}],overlooked:[{name:'黒坂',change:'完成像から基準点への接続が明確になった',sales:'売上指標には未反映'},{name:'西村',change:'曖昧な希望を質問で具体化できた',sales:'再来率への反映待ち'}],resources:[{name:'比較教材',need:88,current:42},{name:'展開図教材',need:81,current:35},{name:'Interview質問集',need:58,current:66}],requests:[{id:'mreq-1',from:'河原町店',title:'展開図教材の共通化',body:'顔まわり設計の展開図を店舗共通Libraryへ追加したい。',status:'new',critical:false},{id:'mreq-2',from:'Team Support',title:'Support負荷の調整',body:'黒坂さんのIssue Reviewが小畑へ集中しています。',status:'in_progress',critical:true}],interventions:[],archive:[]};
function clone(x){return JSON.parse(JSON.stringify(x))}function merge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a;const o={...a};Object.keys(b||{}).forEach(k=>o[k]=a&&typeof a[k]==='object'&&!Array.isArray(a[k])&&typeof b[k]==='object'&&!Array.isArray(b[k])?merge(a[k],b[k]):b[k]);return o}function load(){try{const raw=localStorage.getItem(KEY);return raw?merge(clone(defaults),JSON.parse(raw)):clone(defaults)}catch{return clone(defaults)}}let data=load();
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),1700)}function save(msg='保存しました'){data.schemaVersion='4.4';localStorage.setItem(KEY,JSON.stringify(data));if(msg)toast(msg)}
function logged(){try{const s=JSON.parse(localStorage.getItem(SESSION)||sessionStorage.getItem(SESSION)||'null');return s&&s.expires>Date.now()?s:null}catch{return null}}function setLogin(remember){const s={id:'management',expires:Date.now()+(remember?30:1)*86400000};sessionStorage.setItem(SESSION,JSON.stringify(s));if(remember)localStorage.setItem(SESSION,JSON.stringify(s));else localStorage.removeItem(SESSION)}function unlock(){document.getElementById('auth').classList.add('off');document.getElementById('app').classList.remove('hidden');renderAll()}function lock(){document.getElementById('app').classList.add('hidden');document.getElementById('auth').classList.remove('off')}
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('id')==='management'&&f.get('password')==='management1211'){document.getElementById('loginError').classList.remove('show');setLogin(Boolean(f.get('remember')));unlock()}else{const x=document.getElementById('loginError');x.textContent='Management IDまたはパスワードが違います';x.classList.add('show')}});document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem(SESSION);sessionStorage.removeItem(SESSION);lock()};
function ui(){try{return JSON.parse(localStorage.getItem(UIKEY)||'{}')}catch{return {}}}function setUi(p){localStorage.setItem(UIKEY,JSON.stringify({...ui(),...p}))}function applySidebar(){document.body.classList.toggle('sidebar-collapsed',Boolean(ui().sidebarCollapsed))}document.getElementById('sidebarToggle').onclick=()=>{setUi({sidebarCollapsed:!document.body.classList.contains('sidebar-collapsed')});applySidebar()};const tooltip=document.getElementById('tooltip');document.querySelectorAll('.nav').forEach(n=>{n.addEventListener('mouseenter',()=>{if(!document.body.classList.contains('sidebar-collapsed'))return;tooltip.textContent=n.dataset.tip;const r=n.getBoundingClientRect();tooltip.style.left=(r.right+8)+'px';tooltip.style.top=(r.top+7)+'px';tooltip.style.display='block'});n.addEventListener('mouseleave',()=>tooltip.style.display='none')});
function currentStore(){return data.stores.find(x=>x.id===data.selectedStore)||data.stores[0]}function showPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const p=document.getElementById('page-'+name);if(p)p.classList.add('active');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));setUi({page:name});window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
function syncSupport(){try{const s=JSON.parse(localStorage.getItem(SUPPORT_KEY)||'null');if(!s)return;const pending=(s.requests||[]).filter(x=>x.status==='new'||x.status==='in_progress').length;const decisions=(s.decisions||[]).length;if(pending&&!data.requests.some(x=>x.id==='support-sync'))data.requests.push({id:'support-sync',from:'Team Support',title:'Support側の未処理Request',body:`現在 ${pending}件が未処理です。Support Decisionは ${decisions}件保存されています。`,status:'new',critical:pending>3})}catch{}}
function renderStoreSelect(){const el=document.getElementById('storeSelect');el.innerHTML=data.stores.map(x=>`<option value="${x.id}" ${x.id===data.selectedStore?'selected':''}>${esc(x.name)}</option>`).join('');el.onchange=()=>{data.selectedStore=el.value;save('表示店舗を変更しました');renderAll()}}
function renderToday(){const s=currentStore();const issue=data.organizationIssue;document.getElementById('page-today').innerHTML=`<div class="page-head"><div><div class="eyebrow">MANAGEMENT / MAIN STORY</div><h1>Management Today</h1><p class="lead">組織のどこへ介入すると、現場全体の生産性が最も上がるか。</p></div><div class="auto-save"><span class="dot"></span>自動保存</div></div><section class="main-story"><div class="story-copy"><div class="story-kicker"><b>ORGANIZATION ISSUE</b><span class="pill red">波及度 高</span></div><div class="story-title">${esc(issue.title)}</div><p class="story-desc">${esc(issue.detail)}</p><div class="story-foot"><div class="chips"><span class="chip">${esc(issue.impact)}</span><span class="chip">${esc(issue.evidence)}</span></div><button id="openIntervention" class="primary">介入を設計する</button></div></div><aside class="summary-card"><div class="card-title">${esc(s.name)} / OVERVIEW</div><h2>構造を把握</h2><div class="metric-row"><div class="metric"><b>${s.staff}</b><small>対象スタッフ</small></div><div class="metric"><b>${s.issueRate}%</b><small>共通Issue率</small></div><div class="metric"><b>${s.supportLoad}%</b><small>Support負荷</small></div><div class="metric"><b>${s.growth}%</b><small>Growth可視性</small></div></div><span class="pill purple">個人ログを読まずに判断</span></aside></section><div class="bento mobile-carousel"><article class="card span-4"><div class="card-title">SUPPORT LOAD</div><h2>診断負荷の偏り</h2><div class="list">${data.support.map(x=>`<div class="list-item"><div><b>${esc(x.name)}</b><small>深掘り ${x.deep}件・待ち ${x.wait}件</small></div><span class="pill ${x.load>75?'red':x.load>60?'yellow':'green'}">${x.load}%</span></div>`).join('')}</div><button class="mini-link" data-page="intelligence">負荷構造を見る →</button></article><article class="card span-4"><div class="card-title">OVERLOOKED GROWTH</div><h2>見逃している成長</h2><div class="list">${data.overlooked.map(x=>`<div class="list-item"><div><b>${esc(x.name)}</b><small>${esc(x.change)}</small></div></div>`).join('')}</div></article><article class="card span-4"><div class="card-title">EDUCATION RESOURCE GAP</div><h2>不足している入口</h2><div class="list">${data.resources.map(x=>`<div class="list-item"><div><b>${esc(x.name)}</b><small>必要 ${x.need} / 現在 ${x.current}</small></div><span class="pill ${x.need-x.current>35?'red':'yellow'}">差 ${x.need-x.current}</span></div>`).join('')}</div></article></div>`;document.getElementById('openIntervention').onclick=()=>showPage('intervention');document.querySelectorAll('#page-today [data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page))}
function renderIntelligence(){document.getElementById('page-intelligence').innerHTML=`<div class="page-head"><div><div class="eyebrow">ORGANIZATION INTELLIGENCE</div><h1>一つのチャートに、一つの判断</h1><p class="lead">店舗全体のボトルネックとJourney適合を分けて確認します。</p></div></div><div class="bento"><article class="card span-6"><div class="card-title">RECOGNITION BOTTLENECK</div><h2>どこで認識が止まっているか</h2><div class="chart-list">${data.gaps.map(x=>`<div class="chart-row"><span>${esc(x.name)}</span><div class="bar"><span style="width:${x.value}%"></span></div><b>${x.count}</b></div>`).join('')}</div><p style="margin-top:16px">Message：RecognitionからPlanningへの変換が最優先。</p></article><article class="card span-6"><div class="card-title">JOURNEY DISTRIBUTION</div><h2>どの入口を支援すべきか</h2><div class="chart-list">${data.journeys.map(x=>`<div class="chart-row"><span>${esc(x.name)}</span><div class="bar"><span style="width:${x.value}%"></span></div><b>${x.value}</b></div>`).join('')}</div><p style="margin-top:16px">Message：写真比較に展開図を補助接続する価値が高い。</p></article><article class="card span-7"><div class="card-title">SUPPORT CAPACITY</div><h2>誰へ判断が集中しているか</h2><div class="chart-list">${data.support.map(x=>`<div class="chart-row"><span>${esc(x.name)}</span><div class="bar"><span style="width:${x.load}%"></span></div><b>${x.load}%</b></div>`).join('')}</div></article><article class="card span-5"><div class="card-title">DECISION</div><h2>${esc(data.organizationIssue.decision)}</h2><p>個人への指示ではなく、全店舗で使える教育資源として介入します。</p><button class="mini-link" data-page="intervention">介入案を作成 →</button></article></div>`;document.querySelectorAll('#page-intelligence [data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page))}
function renderComparison(){document.getElementById('page-comparison').innerHTML=`<div class="page-head"><div><div class="eyebrow">STORE COMPARISON</div><h1>優劣ではなく、構造差を比較する</h1><p class="lead">店舗ランキングではなく、入口・Support負荷・Issue構造の違いを見る。</p></div></div><div class="comparison">${data.stores.filter(x=>x.id!=='all').map(x=>`<article class="store-card ${x.id===data.selectedStore?'active':''}"><span class="pill purple">${esc(x.name)}</span><h3>構造スナップショット</h3><div class="store-kpis"><div><b>${x.issueRate}%</b><small>共通Issue</small></div><div><b>${x.supportLoad}%</b><small>Support負荷</small></div><div><b>${x.growth}%</b><small>Growth可視性</small></div><div><b>${x.staff}</b><small>対象人数</small></div></div><button class="mini-link" data-store="${x.id}">この店舗を見る →</button></article>`).join('')}</div>`;document.querySelectorAll('[data-store]').forEach(b=>b.onclick=()=>{data.selectedStore=b.dataset.store;save('店舗を切り替えました');renderAll();showPage('today')})}
function renderIntervention(){document.getElementById('page-intervention').innerHTML=`<div class="page-head"><div><div class="eyebrow">INTERVENTION DESIGN</div><h1>組織Issueへ介入する</h1><p class="lead">個人を矯正せず、Journey・教材・Support配分を変えます。</p></div></div><div class="intervention-layout"><form id="interventionForm" class="intervention-form"><div class="field"><label>対象Issue</label><input name="issue" value="${esc(data.organizationIssue.title)}"></div><div class="field"><label>介入タイプ</label><div class="choice-grid"><button type="button" class="choice active" data-choice="教材">教材</button><button type="button" class="choice" data-choice="Journey">Journey</button><button type="button" class="choice" data-choice="Support配分">Support配分</button></div><input id="interventionType" name="type" value="教材" type="hidden"></div><div class="field"><label>介入内容</label><textarea name="action">写真比較ルートへ展開図教材を補助接続し、完成像から基準点への変換を検証する。</textarea></div><div class="field"><label>成功条件</label><textarea name="success">3店舗で同じIssueに対するPracticeが設計され、4週間以内にPlanning GapのEvidenceが増える。</textarea></div><div class="field"><label>送信先</label><select name="target"><option>全Team Support</option><option>河原町店 Team Support</option><option>樟葉店 Team Support</option></select></div><button class="primary" style="width:100%">介入案を保存して送る</button></form><aside class="intervention-preview"><div class="card-title">DECISION PREVIEW</div><h2>教育資源を変える</h2><p>スタッフ個人へ命令せず、Issueへ答えやすい環境を作ります。</p><div class="privacy-note" style="margin-top:16px"><b>公開範囲</b><br>管理：集約判断<br>Support：実行内容<br>スタッフ：自分に必要な次のPractice</div></aside></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('interventionType').value=b.dataset.choice});document.getElementById('interventionForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const record={id:'int-'+Date.now(),date:new Date().toISOString(),issue:f.get('issue'),type:f.get('type'),action:f.get('action'),success:f.get('success'),target:f.get('target'),status:'sent'};data.interventions.unshift(record);data.archive.unshift({...record,kind:'Intervention'});data.requests.unshift({id:'mreq-'+Date.now(),from:'Management',title:'組織介入の実行依頼',body:record.action,status:'new',critical:false});try{const raw=localStorage.getItem(SUPPORT_KEY);if(raw){const support=JSON.parse(raw);support.requests=Array.isArray(support.requests)?support.requests:[];support.requests.unshift({id:'mg-'+record.id,from:'Management',title:'組織介入の実行依頼',body:record.action,status:'new',due:'今週'});localStorage.setItem(SUPPORT_KEY,JSON.stringify(support))}}catch{}save('Team Supportへ介入案を送りました');renderAll();showPage('archive')}}
function renderRequests(){const active=data.requests.filter(x=>x.status!=='resolved');document.getElementById('page-requests').innerHTML=`<div class="page-head"><div><div class="eyebrow">STORE REQUESTS</div><h1>店舗・Supportからの判断依頼</h1><p class="lead">既読・対応・解決確認を分けて管理します。</p></div></div><div class="request-list">${data.requests.map(x=>`<article class="request-item ${x.critical?'critical':''}"><div class="item-top"><div><b>${esc(x.title)}</b><div style="font-size:12px;color:var(--muted)">${esc(x.from)}</div></div><span class="pill ${x.status==='new'?'red':x.status==='in_progress'?'yellow':'green'}">${x.status==='new'?'New':x.status==='in_progress'?'In Progress':'Resolved'}</span></div><p>${esc(x.body)}</p><div class="item-actions"><button class="small-btn" data-status="read" data-id="${x.id}">既読</button><button class="small-btn" data-status="in_progress" data-id="${x.id}">対応中</button><button class="small-btn primary-action" data-status="resolved" data-id="${x.id}">解決</button></div></article>`).join('')}</div>`;document.getElementById('requestBadge').textContent=active.length;document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{const x=data.requests.find(v=>v.id===b.dataset.id);if(x){x.status=b.dataset.status;save('Requestを更新しました');renderAll();showPage('requests')}})}
function renderArchive(){document.getElementById('page-archive').innerHTML=`<div class="page-head"><div><div class="eyebrow">DECISION ARCHIVE</div><h1>組織判断の履歴</h1><p class="lead">当時のIssue・介入理由・成功条件を上書きせず保存します。</p></div></div><div class="archive-list">${data.archive.length?data.archive.map(x=>`<article class="archive-item"><div class="item-top"><span class="pill purple">${esc(x.kind||x.type)}</span><small style="color:var(--muted)">${new Date(x.date).toLocaleString('ja-JP')}</small></div><h3>${esc(x.issue)}</h3><p><b>介入：</b>${esc(x.action)}</p><p><b>成功条件：</b>${esc(x.success)}</p><p><b>対象：</b>${esc(x.target)}</p></article>`).join(''):`<div class="card" style="text-align:center;color:var(--muted);padding:40px">介入案を保存すると、ここに履歴が追加されます。</div>`}</div>`}
function renderPrivacy(){document.getElementById('page-privacy').innerHTML=`<div class="page-head"><div><div class="eyebrow">PRIVACY & INFORMATION GRAVITY</div><h1>見られる情報と、見せる情報を分ける</h1><p class="lead">管理権限があっても、意思決定に不要な個人ログは表示しません。</p></div></div><div class="privacy-note"><b>Managementの原則</b><br>個人監視ではなく、組織構造・教育資源・Support容量を判断する。</div><div class="privacy-grid"><article class="privacy-card"><b>通常表示</b><p>店舗集約、Gap分布、Journey分布、Support負荷、見逃された成長。</p></article><article class="privacy-card"><b>目的がある時のみ</b><p>個人のCurrent Position、担当Support、関連Issue。</p></article><article class="privacy-card"><b>原則非表示</b><p>Interview生回答、AI内部仮説、Support間の未確定メモ。</p></article></div>`}
function renderAll(){syncSupport();renderStoreSelect();renderToday();renderIntelligence();renderComparison();renderIntervention();renderRequests();renderArchive();renderPrivacy();applySidebar();const p=ui().page||'today';showPage(document.getElementById('page-'+p)?p:'today')}
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='growth-os-management-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('バックアップを書き出しました')};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=merge(clone(defaults),JSON.parse(r.result));save('データを読み込みました');renderAll()}catch{toast('JSONを読み込めませんでした')}};r.readAsText(f)};
if(logged())unlock();else lock();applySidebar();
</script>
</body>
</html>
