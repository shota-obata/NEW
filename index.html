/* JOURNEY_MAP_LAYOUT_FIX_V1 */
#journey{max-width:1560px;overflow-x:hidden}
#journey .head{align-items:flex-end}
#journey .journeyhero{grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);align-items:stretch}
#journey .journeyvision,#journey .timebox{min-width:0}
#journey .journeyvision h2{overflow-wrap:anywhere}
#journey .metricgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
#journey .jmetric{min-width:0;overflow:hidden}
#journey .jmetric b{font-size:clamp(20px,2vw,27px);overflow-wrap:anywhere}
#journey .timeline{width:100%;overflow-x:auto;overflow-y:hidden;padding:14px 4px 22px;scrollbar-gutter:stable;overscroll-behavior-x:contain}
#journey .road{min-width:1120px;grid-template-columns:repeat(5,minmax(190px,1fr));gap:16px;align-items:stretch;padding:28px 8px 4px}
#journey .road:before{left:9%;right:9%;top:51px}
#journey .cp{display:flex;flex-direction:column;min-width:0}
#journey .cpbody{display:flex;flex:1;flex-direction:column;min-height:0;height:auto;overflow:hidden;overflow-wrap:anywhere;word-break:break-word}
#journey .cpbody h3{line-height:1.45}
#journey .cpmeta{line-height:1.65;overflow-wrap:anywhere}
#journey .criteria{margin-top:12px;overflow-wrap:anywhere}
#journey .cpbody .btn,#journey .cpbody button{margin-top:auto;width:100%}
#journey .forecastbar{min-width:0}
#journey .alert{overflow-wrap:anywhere}

@media(max-width:1180px){
  #journey .journeyhero{grid-template-columns:1fr}
  #journey .metricgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #journey .road{min-width:1040px}
}

@media(max-width:920px){
  #journey{padding-left:14px;padding-right:14px}
  #journey .head{align-items:flex-start}
  #journey .head h1{font-size:32px}
  #journey .journeyhero{grid-template-columns:1fr}
  #journey .metricgrid{grid-template-columns:1fr 1fr}
  #journey .timeline{overflow:visible;padding:6px 0}
  #journey .road{min-width:0;display:flex;flex-direction:column;gap:14px;padding:0;position:relative}
  #journey .road:before{left:23px;right:auto;top:24px;bottom:24px;width:4px;height:auto}
  #journey .cp{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;text-align:left;align-items:start}
  #journey .cpdot{width:44px;height:44px;margin:2px 0 0;box-shadow:0 0 0 5px var(--bg)}
  #journey .cp.current .cpdot{box-shadow:0 0 0 5px var(--blue2)}
  #journey .cpbody{margin-top:0;min-height:0;padding:16px}
  #journey .cpbody h3{margin-top:7px}
}

@media(max-width:560px){
  #journey .metricgrid{grid-template-columns:1fr}
  #journey .journeyvision h2{font-size:25px}
  #journey .timebox b{font-size:32px}
  #journey .cp{grid-template-columns:42px minmax(0,1fr);gap:10px}
  #journey .cpdot{width:40px;height:40px}
  #journey .road:before{left:20px}
}

||{});state.journey=Object.assign({},fallback.journey,state.journey||{});if(!Array.isArray(state.journey.checkpoints)||!state.journey.checkpoints.length)state.journey.checkpoints=structuredClone(fallback.journey.checkpoints);state.journey.checkpoints=state.journey.checkpoints.map((c,i)=>Object.assign({id:'cp'+(i+1),code:'CP'+(i+1),title:'Checkpoint '+(i+1),date:state.deadline,type:'Required',status:i===0?'current':'locked',hours:0,actual:0,criteria:'',evidence:'',issue:'',depends:''},c));if(!Array.isArray(state.journey.history))state.journey.history=[];if(!Array.isArray(state.library))state.library=structuredClone(fallback.library);state.library=state.library.map((a,i)=>Object.assign({id:'legacy-'+i,title:'Untitled',tag:'',case:'',decision:'',correction:'',rule:'',next:'',image:'',updatedBy:'System',updatedAt:'',history:[]},a));let editingId=null,pendingImage=null,removePending=false;const menus={staff:[['DAILY','home','Home'],['GROWTH','journey','Journey'],['','issue','Issue A'],['','practice','Practice'],['KNOWLEDGE','library','Library'],['SYSTEM','settings','Settings']],support:[['SUPPORT','support','Support Home'],['GROWTH','journey','Journey'],['','issue','Issue A'],['KNOWLEDGE','library','Library'],['SYSTEM','settings','Settings']],management:[['MANAGEMENT','management','Overview'],['GROWTH','journey','Journey'],['KNOWLEDGE','library','Library'],['SYSTEM','settings','Settings']]};function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('.save').textContent='● 保存済み'}function now(){return new Date().toLocaleString('ja-JP',{hour12:false})}function side(){let out='';for(const[lab,p,t]of menus[state.role]){if(lab)out+=`<div class="label">${lab}</div>`;out+=`<button class="nav ${state.page===p?'active':''}" data-page="${p}">${t}</button>`}document.getElementById('side').innerHTML=out}function show(p){state.page=p; ection class="card s7"><h2>${esc(state.issue.title)}</h2><div class="alert">Support CorrectionをLibraryへ直接追記してください。</div></section><section class="card s5"><div class="title">SHARED LIBRARY</div><h2>${state.library.length} assets</h2><button class="btn primary" data-page="library">Libraryを修正</button></section></div>`;document.getElementById('management').innerHTML=`<div class="head"><div><div class="eyebrow">MANAGEMENT</div><h1>OSが機能しているかを見る。</h1></div></div><div class="stats"><div class="stat">Journey<b>${state.progress}%</b></div><div class="stat">Library<b>${state.library.length}</b></div><div class="stat">Issue Age<b>${state.issue.age}日</b></div><div class="stat">Overtime<b>0h</b></div></div>`;document.getElementById('settings').innerHTML=`<div class="head"><div><div class="eyebrow">SETTINGS</div><h1>データ</h1></div></div><div class="card"><button class="btn secondary" data-action="export">JSONを書き出す</button></div>`;renderLibrary()}function daysTo(date){return Math.ceil((new Date(date+'T23:59:59')-new Date())/86400000)}function renderJourney(){const j=state.journey,cps=j.checkpoints,current=cps.find(c=>c.status==='current')||cps.find(c=>c.status!=='done')||cps[cps.length-1],days=Math.max(0,daysTo(state.deadline)),weeks=Math.max(1,days/7),remaining=Math.max(0,(+j.requiredHours||0)-(+j.actualHours||0)),capacity=Math.round(weeks*(+state.hours||0)*10)/10,pace=Math.round((remaining/weeks)*10)/10,forecastDays=Math.ceil((remaining/Math.max(.1,+state.hours||0))*7),forecastDate=new Date(Date.now()+forecastDays*86400000).toISOString().slice(0,10),gap=capacity-remaining,plan=Math.min(100,+state.planned||0),actual=Math.min(100,+state.progress||0),risk=gap<0?'Critical':actual+8<plan?'At Risk':'On Track';return `<div class="head"><div><div class="eyebrow">VISION BACKCAST / TIME FIRST</div><h1>Journey Map</h1><p class="lead">Visionから期限・勤務時間・Checkpoint・Issue Aを逆算します。</p></div></div><div class="grid"><section class="card s12 journeyhero journeyvision"><div><span class="pill blue">VI ain><aside class="calendar-right"><div class="right-block"><div class="title">CURRENT CHECKPOINT</div><h3>${esc(currentCheckpointV55()?.code||'-')} ${esc(currentCheckpointV55()?.title||'未設定')}</h3><p>${esc(state.issue?.title||'Issue A未設定')}</p></div><div class="right-block"><h3>今後のモデル</h3><div class="planner-list">${upcoming.slice(0,5).map(x=>`<div class="model-event" data-ui-action="edit-model" data-id="${x.id}"><b>${esc(x.date)} ${esc(x.time)}　${esc(x.name)}</b><small>${esc(x.menu)}・${esc(x.checkpointCode||'')}</small></div>`).join('')||'<p>予定はありません。</p>'}</div></div><button class="btn primary" style="width:100%" data-ui-action="new-model">＋ モデルを入れる</button></aside></div>`}
function openModel(id=null,date=null){editingModelId=id;const x=id?state.modelBookings.find(v=>v.id===id):null;modelHeading.textContent=x?'モデル予定を編集':'モデル予定を追加';mName.value=x?.name||'';mDate.value=x?.date||date||ymd(new Date());mTime.value=x?.time||'10:00';mDuration.value=x?.duration||120;mMenu.value=x?.menu||'カット';mNote.value=x?.validationQuestion||x?.note||'';mCheckpoint.innerHTML=(state.journey?.checkpoints||[]).map(c=>`<option value="${c.id}" ${x?.checkpointId===c.id?'selected':''}>${esc(c.code)} ${esc(c.title)}</option>`).join('');deleteModelBtn.classList.toggle('hidden',!x);modelModal.classList.remove('hidden')}
function saveModel(){const cp=(state.journey?.checkpoints||[]).find(c=>c.id===mCheckpoint.value);const question=mNote.value.trim();const data={id:editingModelId||'model-'+Date.now(),name:mName.value.trim(),date:mDate.value,time:mTime.value,duration:Number(mDuration.value)||120,menu:mMenu.value,checkpointId:mCheckpoint.value,checkpointCode:cp?.code||'',validationQuestion:question,note:question,updatedAt:now()};if(!data.name||!data.date)return alert('モデル名と日付を入力してください。');const i=state.modelBookings.findIndex(x=>x.id===data.id);if(i>=0)state.modelBookings[i]=data;else state.modelBookings.push(data);if(window.GrowthTeam?.commitState)window.GrowthTeam.commitState();else save();modelModal.classList.add('hidden');render()}
const originalRenderV55=render;render=function(){originalRenderV55();ensurePlannerNav();if(state.page==='journey')renderJourneyV55();if(state.page==='planner'){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('planner').classList.add('active');renderPlanner()}document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page))};
document.addEventListener('click',e=>{const page=e.target.closest('[data-page="planner"]');if(page){state.page='planner';save();render();return}const b=e.target.closest('[data-ui-action]');if(!b)return;const a=b.dataset.uiAction;if(a==='new-model')openModel();if(a==='edit-model')openModel(b.dataset.id);if(a==='close-model')modelModal.classList.add('hidden');if(a==='save-model')saveModel();if(a==='delete-model'){if(editingModelId&&confirm('このモデル予定を削除しますか？')){state.modelBookings=state.modelBookings.filter(x=>x.id!==editingModelId);save();modelModal.classList.add('hidden');render()}}if(a==='prev-week'){plannerOffset--;renderPlanner()}if(a==='next-week'){plannerOffset++;renderPlanner()}if(a==='today-week'){plannerOffset=0;renderPlanner()}});render()})();
