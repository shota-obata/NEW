<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Growth OS v5.2</title><style>:root{--bg:#f7f8fa;--card:#fff;--text:#202124;--muted:#6d727b;--line:#e2e5e9;--blue:#5362f6;--blue2:#eef0ff;--green:#1f9d63;--orange:#e99b27;--orange2:#fff5e5;--red:#d94b45;--purple:#8757d5;--shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(30,35,50,.06);--side:230px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{height:68px;background:#fffc;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.mark{width:34px;height:34px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center}.roles{margin-left:auto;display:flex;gap:7px}.role{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-weight:800}.role.active{background:var(--blue2);color:var(--blue)}.save{font-size:12px;color:var(--green);font-weight:900;margin-left:12px}.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - 68px)}.side{background:#fff;border-right:1px solid var(--line);padding:18px 11px;position:sticky;top:68px;height:calc(100vh - 68px)}.nav{width:100%;border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:12px;font-weight:780;color:#43474e}.nav.active{background:var(--blue2);color:var(--blue)}.label{padding:14px 12px 7px;font-size:10px;font-weight:900;letter-spacing:.12em;color:#9aa0a6}.page{display:none;padding:30px;max-width:1420px;margin:auto}.page.active{display:block}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.eyebrow{font-size:11px;color:var(--blue);font-weight:900;letter-spacing:.12em}.head h1{font-size:38px;letter-spacing:-.045em;margin:6px 0}.lead{color:var(--muted);line-height:1.65;margin:0}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);min-width:0}.s8{grid-column:span 8}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}.title{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.12em}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;background:linear-gradient(135deg,#fff,#f4f5ff)}.hero h2{font-size:31px;line-height:1.36;margin:16px 0 10px}.count{border-radius:18px;background:#17191d;color:#fff;padding:20px}.count b{display:block;font-size:44px}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900}.blue{background:var(--blue2);color:var(--blue)}.orange{background:var(--orange2);color:#a76500}.purple{background:#f3edff;color:var(--purple)}.progress{height:11px;background:#eceef2;border-radius:999px;overflow:hidden;margin:11px 0}.progress span{display:block;height:100%;background:var(--blue)}.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:850}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger{background:#fff;border:1px solid #f0b7b4;color:var(--red)}.continue{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:16px}.continue>div{flex:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid var(--line);border-radius:17px;padding:16px}.stat b{display:block;font-size:29px;margin-top:5px}.assets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.asset{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff}.asset h3{margin:10px 0 7px}.asset p{font-size:13px;color:var(--muted);line-height:1.55}.assetimg,.assetempty{width:100%;aspect-ratio:4/3;border-radius:14px;margin-bottom:12px}.assetimg{object-fit:cover;background:#eef0f5;display:block}.assetempty{background:#f1f3f6;display:grid;place-items:center;color:#9aa0a6;font-size:13px}.assetfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:12px;gap:8px}.assetactions{display:flex;gap:7px;flex-wrap:wrap}.small{padding:8px 10px;border-radius:10px;font-size:12px}.history{font-size:11px;color:var(--muted);line-height:1.55;margin-top:10px}.issue{border:1px solid #d9ddff;background:#f7f7ff;border-radius:18px;padding:18px}.alert{border-left:4px solid var(--orange);background:var(--orange2);border-radius:12px;padding:14px;line-height:1.6}.modal{position:fixed;inset:0;background:#14161b80;z-index:100;display:grid;place-items:center;padding:22px}.modalbox{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:24px}.close{border:0;width:38px;height:38px;border-radius:50%;background:#f0f1f3;font-size:20px;float:right}.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.field textarea{min-height:95px}.preview{width:100%;max-height:300px;object-fit:contain;border-radius:14px;background:#f2f3f5;margin-top:12px}.bottom{display:none}@media(max-width:920px){.top{height:auto;flex-wrap:wrap;padding:10px 12px}.roles{width:100%;order:3}.shell{grid-template-columns:1fr}.side{display:none}.page{padding:20px 14px 90px}.grid{display:block}.card{margin-bottom:12px}.hero,.form2{grid-template-columns:1fr}.stats,.assets{grid-template-columns:1fr}.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid var(--line);z-index:60;justify-content:space-around}.bottom button{border:0;background:transparent}}</style></head><body><header class="top"><div class="brand"><div class="mark">G</div>Growth OS <small style="color:var(--muted)">v5.2</small></div><div class="roles"><button class="role active" data-role="staff">Staff</button><button class="role" data-role="support">Support</button><button class="role" data-role="management">Management</button></div><span class="save">● 自動保存</span></header><div class="shell"><aside id="side" class="side"></aside><main><section id="home" class="page active"></section><section id="journey" class="page"></section><section id="issue" class="page"></section><section id="practice" class="page"></section><section id="library" class="page"></section><section id="support" class="page"></section><section id="management" class="page"></section><section id="settings" class="page"></section></main></div><nav class="bottom"><button data-page="home">Home</button><button data-page="journey">Journey</button><button data-page="practice">＋</button><button data-page="library">Library</button></nav><div id="assetModal" class="modal hidden"><div class="modalbox"><button class="close" data-action="close-modal">×</button><div class="eyebrow" id="assetMode">LIBRARY ASSET</div><h2 id="assetHeading">Libraryを編集</h2><div class="form2"><div class="field"><label>タイトル</label><input id="aTitle"></div><div class="field"><label>タグ</label><input id="aTag" placeholder="例：顔まわり / 骨格補正"></div><div class="field"><label>Case｜何が起きた？</label><textarea id="aCase"></textarea></div><div class="field"><label>Decision｜どう判断した？</label><textarea id="aDecision"></textarea></div><div class="field"><label>Support Correction｜どう修正した？</label><textarea id="aCorrection"></textarea></div><div class="field"><label>Transfer Rule｜次回も使える原則</label><textarea id="aRule"></textarea></div><div class="field"><label>Next Test｜次に確かめること</label><textarea id="aNext"></textarea></div><div class="field"><label>画像</label><input id="aImage" type="file" accept="image/*"><small class="lead">画像は自動圧縮してブラウザ内に保存します。</small></div></div><img id="aPreview" class="preview hidden"><div style="display:flex;justify-content:space-between;gap:10px;margin-top:18px"><button id="deleteAsset" class="btn danger hidden" data-action="delete-asset">削除</button><div style="margin-left:auto;display:flex;gap:8px"><button id="removeImage" class="btn secondary hidden" data-action="remove-image">画像を外す</button><button class="btn primary" data-action="save-asset">保存</button></div></div></div></div><script>const KEY='growthOS.unified.v5';const fallback={role:'staff',page:'home',vision:'骨格と髪質を見ながら、顔まわりを自在に設計し、理由まで説明できる美容師',deadline:'2027-04-30',progress:58,planned:72,issue:{title:'異なる骨格でも、完成像から基準点を自分で設定できるか',age:12},library:[{id:'a1',title:'顔まわり基準点の設定',tag:'顔まわり',case:'頬骨が高いモデルで、最短点が上がりすぎた。',decision:'完成像から黒目外側を基準に設定した。',correction:'Supportが引き出し方向を前方へ修正した。',rule:'頬骨の高さだけでなく、顔幅と前髪幅を同時に見る。',next:'異なる顔幅で同じ判断が使えるか確認する。',image:'',updatedBy:'Support',updatedAt:'2026-07-24 00:00',history:[]},{id:'a2',title:'ネープの収まり',tag:'ショート',case:'ネープが浮きやすいモデルで厚みが残った。',decision:'生え方に対して短く設定した。',correction:'短くする前にセクション幅を狭く修正。',rule:'長さより先に生え方とセクション幅を決める。',next:'強い逆毛流でも再現できるか。',image:'',updatedBy:'Staff',updatedAt:'2026-07-23 21:00',history:[]}]};let state;try{state=Object.assign({},fallback,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){state=structuredClone(fallback)}state.issue=Object.assign({},fallback.issue,state.issue||{});if(!Array.isArray(state.library))state.library=structuredClone(fallback.library);state.library=state.library.map((a,i)=>Object.assign({id:'legacy-'+i,title:'Untitled',tag:'',case:'',decision:'',correction:'',rule:'',next:'',image:'',updatedBy:'System',updatedAt:'',history:[]},a));let editingId=null,pendingImage=null,removePending=false;const menus={staff:[['DAILY','home','Home'],['GROWTH','journey','Journey'],['','issue','Issue A'],['','practice','Practice'],['KNOWLEDGE','library','Library'],['SYSTEM','settings','Settings']],support:[['SUPPORT','support','Support Home'],['GROWTH','journey','Journey'],['','issue','Issue A'],['KNOWLEDGE','library','Library'],['SYSTEM','settings','Settings']],management:[['MANAGEMENT','management','Overview'],['GROWTH','journey','Journey'],['KNOWLEDGE','library','Library'],['SYSTEM','settings','Settings']]};function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('.save').textContent='● 保存済み'}function now(){return new Date().toLocaleString('ja-JP',{hour12:false})}function side(){let out='';for(const[lab,p,t]of menus[state.role]){if(lab)out+=`<div class="label">${lab}</div>`;out+=`<button class="nav ${state.page===p?'active':''}" data-page="${p}">${t}</button>`}document.getElementById('side').innerHTML=out}function show(p){state.page=p;render();save()}function render(){document.querySelectorAll('.role').forEach(b=>b.classList.toggle('active',b.dataset.role===state.role));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===state.page));side();document.getElementById('home').innerHTML=`<div class="head"><div><div class="eyebrow">TODAY</div><h1>今日やることは、一つです。</h1><p class="lead">迷わずIssue Aから始めます。</p></div></div><div class="grid"><section class="card s8 hero"><div><span class="pill blue">ISSUE A</span><h2>${esc(state.issue.title)}</h2><p class="lead">期限までの最重要ギャップ。</p><div class="continue"><div><b>今日のPractice</b><p class="lead">モデル1名で基準点を設定し、理由をEvidenceとして残す。</p></div><button class="btn primary" data-page="practice">開始</button></div></div><div class="count"><span>Journey</span><b>${state.progress}%</b><div class="progress"><span style="width:${state.progress}%"></span></div></div></section><section class="card s4"><div class="title">LIBRARY</div><h2>${state.library.length} assets</h2><p class="lead">経験が再利用可能な資産へ変換されています。</p><button class="btn secondary" data-page="library">開く</button></section></div>`;document.getElementById('journey').innerHTML=`<div class="head"><div><div class="eyebrow">JOURNEY</div><h1>Visionまでの時間軸</h1><p class="lead">${esc(state.vision)}</p></div></div><div class="grid"><section class="card s8"><div class="title">PROGRESS</div><h2>${state.progress}% / 計画 ${state.planned}%</h2><div class="progress"><span style="width:${state.progress}%"></span></div></section><section class="card s4"><div class="title">DEADLINE</div><h2>${state.deadline}</h2><p class="lead">時間外労働0時間で設計</p></section></div>`;document.getElementById('issue').innerHTML=`<div class="head"><div><div class="eyebrow">ISSUE A</div><h1>${esc(state.issue.title)}</h1><p class="lead">次のCheckpoint到達を妨げる最重要ギャップ。</p></div></div><div class="card issue"><span class="pill orange">${state.issue.age} days</span><h2>Evidenceを増やして判断基準を確定する</h2></div>`;document.getElementById('practice').innerHTML=`<div class="head"><div><div class="eyebrow">PRACTICE</div><h1>今日の経験を残す</h1></div></div><div class="card"><h2>モデルで基準点を設定</h2><p class="lead">画像と判断理由をLibraryへ直接追加できます。</p><button class="btn primary" data-action="add-asset">Libraryへ追加</button></div>`;document.getElementById('support').innerHTML=`<div class="head"><div><div class="eyebrow">SUPPORT</div><h1>Issueを直すのではなく、学習を増幅する。</h1><p class="lead">Libraryの同じ資産をStaffとSupportが共同編集できます。</p></div></div><div class="grid"><section class="card s7"><h2>${esc(state.issue.title)}</h2><div class="alert">Support CorrectionをLibraryへ直接追記してください。</div></section><section class="card s5"><div class="title">SHARED LIBRARY</div><h2>${state.library.length} assets</h2><button class="btn primary" data-page="library">Libraryを修正</button></section></div>`;document.getElementById('management').innerHTML=`<div class="head"><div><div class="eyebrow">MANAGEMENT</div><h1>OSが機能しているかを見る。</h1></div></div><div class="stats"><div class="stat">Journey<b>${state.progress}%</b></div><div class="stat">Library<b>${state.library.length}</b></div><div class="stat">Issue Age<b>${state.issue.age}日</b></div><div class="stat">Overtime<b>0h</b></div></div>`;document.getElementById('settings').innerHTML=`<div class="head"><div><div class="eyebrow">SETTINGS</div><h1>データ</h1></div></div><div class="card"><button class="btn secondary" data-action="export">JSONを書き出す</button></div>`;renderLibrary()}function renderLibrary(){const canEdit=state.role!=='management';document.getElementById('library').innerHTML=`<div class="head"><div><div class="eyebrow">EXPERIENCE LIBRARY</div><h1>経験を、組織の資産へ。</h1><p class="lead">StaffとSupportが同じ画像・判断・修正内容を共同編集します。</p></div>${canEdit?'<button class="btn primary" data-action="add-asset">＋ 資産を追加</button>':''}</div><div class="assets">${state.library.map(a=>`<article class="asset">${a.image?`<img class="assetimg" src="${a.image}">`:'<div class="assetempty">画像未登録</div>'}<span class="pill purple">${esc(a.tag||'UNTAGGED')}</span><h3>${esc(a.title)}</h3><p><b>Case</b><br>${esc(a.case||'未入力')}</p><p><b>Support Correction</b><br>${esc(a.correction||'未入力')}</p><div class="assetfoot"><small>${esc(a.updatedBy)} · ${esc(a.updatedAt)}</small><div class="assetactions"><button class="btn secondary small" data-action="open-asset" data-id="${a.id}">開く</button>${canEdit?`<button class="btn secondary small" data-action="image-asset" data-id="${a.id}">画像</button>`:''}</div></div>${a.history.length?`<div class="history">変更履歴：${a.history.slice(-3).reverse().map(h=>`${esc(h.by)} ${esc(h.action||'修正')} ${esc(h.at)}`).join(' / ')}</div>`:''}</article>`).join('')}</div>`}function openAsset(id=null,pickImage=false){editingId=id;pendingImage=null;removePending=false;const a=id?state.library.find(x=>x.id===id):{title:'',tag:'',case:'',decision:'',correction:'',rule:'',next:'',image:''};if(!a)return;for(const[el,k]of[['aTitle','title'],['aTag','tag'],['aCase','case'],['aDecision','decision'],['aCorrection','correction'],['aRule','rule'],['aNext','next']])document.getElementById(el).value=a[k]||'';const pv=document.getElementById('aPreview');pv.src=a.image||'';pv.classList.toggle('hidden',!a.image);document.getElementById('deleteAsset').classList.toggle('hidden',!id);document.getElementById('removeImage').classList.toggle('hidden',!a.image);document.getElementById('assetHeading').textContent=id?'Libraryを共同編集':'Libraryへ追加';document.getElementById('assetMode').textContent=state.role.toUpperCase()+' EDIT';document.getElementById('assetModal').classList.remove('hidden');if(pickImage)setTimeout(()=>document.getElementById('aImage').click(),150)}function closeModal(){document.getElementById('assetModal').classList.add('hidden');document.getElementById('aImage').value=''}async function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};img.src=r.result};r.readAsDataURL(file)})}document.getElementById('aImage').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{pendingImage=await compress(f);removePending=false;const pv=document.getElementById('aPreview');pv.src=pendingImage;pv.classList.remove('hidden');document.getElementById('removeImage').classList.remove('hidden')}catch(err){alert('画像を読み込めませんでした。別の画像を選択してください。')}});document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){show(page.dataset.page);return}const role=e.target.closest('[data-role]');if(role){state.role=role.dataset.role;state.page=state.role==='staff'?'home':state.role;show(state.page);return}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='add-asset')openAsset(null,true);if(a==='open-asset')openAsset(el.dataset.id,false);if(a==='image-asset')openAsset(el.dataset.id,true);if(a==='close-modal')closeModal();if(a==='remove-image'){pendingImage='';removePending=true;document.getElementById('aPreview').classList.add('hidden');el.classList.add('hidden')}if(a==='delete-asset'){if(editingId&&confirm('このLibrary資産を削除しますか？')){state.library=state.library.filter(x=>x.id!==editingId);save();closeModal();render()}}if(a==='save-asset'){const old=editingId?state.library.find(x=>x.id===editingId):null,base=old||{id:'a'+Date.now(),image:'',history:[]},editor=state.role==='support'?'Support':'Staff';base.history=[...(base.history||[]),{by:editor,at:now(),action:old?'修正':'作成'}];for(const[elid,k]of[['aTitle','title'],['aTag','tag'],['aCase','case'],['aDecision','decision'],['aCorrection','correction'],['aRule','rule'],['aNext','next']])base[k]=document.getElementById(elid).value.trim();base.title=base.title||'Untitled';if(pendingImage!==null)base.image=pendingImage;if(removePending)base.image='';base.updatedBy=editor;base.updatedAt=now();if(!old)state.library.unshift(base);save();closeModal();render()}if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='growth-os.json';link.click()}});document.getElementById('assetModal').addEventListener('click',e=>{if(e.target.id==='assetModal')closeModal()});render();show(state.page||'home');</script></body></html>
