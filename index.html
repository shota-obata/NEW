/* JOURNEY_MAP_LAYOUT_FIX_V1 */
#journey{max-width:1560px;overflow-x:hidden}
#journey .head{align-items:flex-end}
#journey .journeyhero{grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);align-items:stretch}
#journey .journeyvision,#journey .timebox{min-width:0}
#journey .journeyvision h2{overflow-wrap:anywhere}
#journey .metricgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
#journey .jmetric{min-width:0;overflow:hidden}
#journey .jmetric b{font-size:clamp(20px,2vw,27px);overflow-wrap:anywhere}
#journey .timeline{width:100%;overflow-x:auto;overflow-y:hidden;padding:14px 4px 22px;scrollbar-gutter:stable;overscroll-behavior-x:contain}
#journey .road{min-width:1120px;grid-template-columns:repeat(5,minmax(190px,1fr));gap:16px;align-items:stretch;padding:28px 8px 4px}
#journey .road:before{left:9%;right:9%;top:51px}
#journey .cp{display:flex;flex-direction:column;min-width:0}
#journey .cpbody{display:flex;flex:1;flex-direction:column;min-height:0;height:auto;overflow:hidden;overflow-wrap:anywhere;word-break:break-word}
#journey .cpbody h3{line-height:1.45}
#journey .cpmeta{line-height:1.65;overflow-wrap:anywhere}
#journey .criteria{margin-top:12px;overflow-wrap:anywhere}
#journey .cpbody .btn,#journey .cpbody button{margin-top:auto;width:100%}
#journey .forecastbar{min-width:0}
#journey .alert{overflow-wrap:anywhere}

@media(max-width:1180px){
  #journey .journeyhero{grid-template-columns:1fr}
  #journey .metricgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #journey .road{min-width:1040px}
}

@media(max-width:920px){
  #journey{padding-left:14px;padding-right:14px}
  #journey .head{align-items:flex-start}
  #journey .head h1{font-size:32px}
  #journey .journeyhero{grid-template-columns:1fr}
  #journey .metricgrid{grid-template-columns:1fr 1fr}
  #journey .timeline{overflow:visible;padding:6px 0}
  #journey .road{min-width:0;display:flex;flex-direction:column;gap:14px;padding:0;position:relative}
  #journey .road:before{left:23px;right:auto;top:24px;bottom:24px;width:4px;height:auto}
  #journey .cp{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;text-align:left;align-items:start}
  #journey .cpdot{width:44px;height:44px;margin:2px 0 0;box-shadow:0 0 0 5px var(--bg)}
  #journey .cp.current .cpdot{box-shadow:0 0 0 5px var(--blue2)}
  #journey .cpbody{margin-top:0;min-height:0;padding:16px}
  #journey .cpbody h3{margin-top:7px}
}

@media(max-width:560px){
  #journey .metricgrid{grid-template-columns:1fr}
  #journey .journeyvision h2{font-size:25px}
  #journey .timebox b{font-size:32px}
  #journey .cp{grid-template-columns:42px minmax(0,1fr);gap:10px}
  #journey .cpdot{width:40px;height:40px}
  #journey .road:before{left:20px}
}

ection class="card s7"><h2>${esc(state.issue.title)}</h2><div class="alert">Support CorrectionをLibraryへ直接追記してください。</div></section><section class="card s5"><div class="title">SHARED LIBRARY</div><h2>${state.library.length} assets</h2><button class="btn primary" data-page="library">Libraryを修正</button></section></div>`;document.getElementById('management').innerHTML=`<div class="head"><div><div class="eyebrow">MANAGEMENT</div><h1>OSが機能しているかを見る。</h1></div></div><div class="stats"><div class="stat">Journey<b>${state.progress}%</b></div><div class="stat">Library<b>${state.library.length}</b></div><div class="stat">Issue Age<b>${state.issue.age}日</b></div><div class="stat">Overtime<b>0h</b></div></div>`;document.getElementById('settings').innerHTML=`<div class="head"><div><div class="eyebrow">SETTINGS</div><h1>データ</h1></div></div><div class="card"><button class="btn secondary" data-action="export">JSONを書き出す</button></div>`;renderLibrary()}function daysTo(date){return Math.ceil((new Date(date+'T23:59:59')-new Date())/86400000)}function renderJourney(){const j=state.journey,cps=j.checkpoints,current=cps.find(c=>c.status==='current')||cps.find(c=>c.status!=='done')||cps[cps.length-1],days=Math.max(0,daysTo(state.deadline)),weeks=Math.max(1,days/7),remaining=Math.max(0,(+j.requiredHours||0)-(+j.actualHours||0)),capacity=Math.round(weeks*(+state.hours||0)*10)/10,pace=Math.round((remaining/weeks)*10)/10,forecastDays=Math.ceil((remaining/Math.max(.1,+state.hours||0))*7),forecastDate=new Date(Date.now()+forecastDays*86400000).toISOString().slice(0,10),gap=capacity-remaining,plan=Math.min(100,+state.planned||0),actual=Math.min(100,+state.progress||0),risk=gap<0?'Critical':actual+8<plan?'At Risk':'On Track';return `<div class="head"><div><div class="eyebrow">VISION BACKCAST / TIME FIRST</div><h1>Journey Map</h1><p class="lead">Visionから期限・勤務時間・Checkpoint・Issue Aを逆算します。</p></div></div><div class="grid"><section class="card s12 journeyhero journeyvision"><div><span class="pill blue">VI ata-id="${a.id}">開く</button>${canEdit?`<button class="btn secondary small" data-action="image-asset" data-id="${a.id}">画像</button>`:''}</div></div>${a.history.length?`<div class="history">変更履歴：${a.history.slice(-3).reverse().map(h=>`${esc(h.by)} ${esc(h.action||'修正')} ${esc(h.at)}`).join(' / ')}</div>`:''}</article>`).join('')}</div>`}function openAsset(id=null,pickImage=false){editingId=id;pendingImage=null;removePending=false;const a=id?state.library.find(x=>x.id===id):{title:'',tag:'',case:'',decision:'',correction:'',rule:'',next:'',image:''};if(!a)return;for(const[el,k]of[['aTitle','title'],['aTag','tag'],['aCase','case'],['aDecision','decision'],['aCorrection','correction'],['aRule','rule'],['aNext','next']])document.getElementById(el).value=a[k]||'';const pv=document.getElementById('aPreview');pv.src=a.image||'';pv.classList.toggle('hidden',!a.image);document.getElementById('deleteAsset').classList.toggle('hidden',!id);document.getElementById('removeImage').classList.toggle('hidden',!a.image);document.getElementById('assetHeading').textContent=id?'Libraryを共同編集':'Libraryへ追加';document.getElementById('assetMode').textContent=state.role.toUpperCase()+' EDIT';document.getElementById('assetModal').classList.remove('hidden');if(pickImage)setTimeout(()=>document.getElementById('aImage').click(),150)}function closeModal(){document.getElementById('assetModal').classList.add('hidden');document.getElementById('aImage').value=''}async function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};img.src=r.result};r.readAsDataURL(file)})}document.getElementById('aImage').addEventListener('change al*100)):0}function saveCp(action='Checkpointを更新'){const c=cpById(activeCpId);if(!c)return;c.title=cpTitle.value.trim();c.date=cpDate.value;c.status=cpStatus.value;c.hours=Number(cpHours.value)||0;c.actual=Number(cpActual.value)||0;c.criteria=cpCriteria.value.trim();c.issue=cpIssue.value.trim();c.evidence=cpEvidenceTarget.value.trim();c.history.push(stamp(action));state.journey.history.push(stamp(action,`${c.code||''} ${c.title}`));if(c.status==='current'&&c.issue)state.issue.title=c.issue;recalcJourney();save();checkpointModal.classList.add('hidden');render()}function augmentJourney(){document.querySelectorAll('#journey .cp').forEach((node,i)=>{const c=state.journey.checkpoints[i];if(!c||node.querySelector('.checkpoint-ops'))return;const body=node.querySelector('.cpbody')||node;const box=document.createElement('div');box.className='checkpoint-ops';box.innerHTML=`<div class="opsnote">Evidence ${(c.evidenceItems||[]).length}件・Support修正 ${(c.supportHistory||[]).length}件</div><div class="opsbar"><button class="btn secondary small" data-action="open-checkpoint" data-id="${c.id}">Checkpointを開く</button>${c.status==='current'?'<button class="btn primary small" data-page="support">Supportへ</button>':''}</div>`;body.appendChild(box)})}function renderSupportOps(){const root=document.getElementById('support');if(!root)return;const c=currentCp();const sessions=state.supportSessions.filter(x=>!c||x.checkpointId===c.id);root.innerHTML=`<div class="head"><div><div class="eyebrow">SUPPORT OPERATION</div><h1>答えを渡さず、判断を修正する。</h1><p class="lead">Current CheckpointとIssue Aを基準に、比較・診断・修正・再検証・Library化まで記録します。</p></div></div><section class="card"><div class="support-summary"><div><div class="title">CURRENT CHECKPOINT</div><b>${esc(c?.code||'-')} ${esc(c?.title||'未設定')}</b></div><div><div class="title">ISSUE A</div><b>${esc(state.issue?.title||c?.issue||'未設定')}</b></div><div><div class="title">EVIDENCE</div><b>${c?.evidenceItems?.length||0}件</b></div></div></section><section class="card" style="margin-top:16px"><div class="supportflow"><div class="supportstep"><h3>1｜比較質問</h3><textarea id="spCompare" placeholder="何と何を比べると違いが見えるか？"></textarea></div><div class="supportstep"><h3>2｜原因診断</h3><textarea id="spDiagnosis" placeholder="観察・完成像・基準点・操作のどこでズレたか？"></textarea></div><div class="supportstep"><h3>3｜Support修正</h3><textarea id="spCorrection" placeholder="判断をどう修正するか？"></textarea></div><div class="supportstep"><h3>4｜次の検証</h3><textarea id="spNext" placeholder="次に何を、どの条件で確かめるか？"></textarea></div></div><div class="opsbar" style="justify-content:flex-end"><button class="btn secondary" data-action="save-support">Support記録を保存</button><button class="btn primary" data-action="apply-support">Issue Aへ反映</button><button class="btn primary" data-action="support-to-library">Library化</button></div></section><section class="card" style="margin-top:16px"><div class="title">SUPPORT HISTORY</div>${sessions.slice().reverse().map(x=>`<div class="support-history"><b>${esc(x.by)}・${esc(x.at)}</b><br>比較：${esc(x.compare)}<br>診断：${esc(x.diagnosis)}<br>修正：${esc(x.correction)}<br>次：${esc(x.next)}</div>`).join('')||'<p class="lead">まだSupport記録はありません。</p>'}</section>`}function supportDraft(){const c=currentCp();return{id:'sp-'+Date.now(),checkpointId:c?.id||'',issue:state.issue?.title||c?.issue||'',compare:spCompare.value.trim(),diagnosis:spDiagnosis.value.trim(),correction:spCorrection.value.trim(),next:spNext.value.trim(),by:actor(),at:now()}}function saveSupport(apply=false,toLibrary=false){const c=currentCp();const x=supportDraft();if(!x.compare&&!x.diagnosis&&!x.correction&&!x.next)return alert('Support内容を入力してください。');state.supportSessions.push(x);if(c){c.supportHistory.push(x);c.history.push(stamp('Support介入',x.correction));if(apply){c.issue=x.next||c.issue;state.issue.title=x.next||state.issue.title}}if(toLibrary){state.library.unshift({id:'support-'+Date.now(),title:`${c?.title||'Checkpoint'}｜Support修正`,tag:'Support',case:x.issue,decision:x.diagnosis,correction:x.correction,rule:
